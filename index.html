<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ханафуда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:#060402;
  font-family:Georgia,serif;color:#e8d5b0;
}
h1{font-size:clamp(16px,4vw,24px);letter-spacing:6px;
   color:#c9a227;text-shadow:0 0 20px rgba(201,162,39,.5);}
/* Холст на весь экран; отступы безопасной зоны считает boardLayout() */
canvas{display:block;cursor:pointer;
       position:fixed;left:0;top:0;
       touch-action:manipulation;
       -webkit-user-select:none;user-select:none;}
footer{color:#5a4a28;font-size:11px;text-align:center;max-width:900px;line-height:1.7;}

<body>
<canvas id="c"></canvas>
<script>
// ── Telegram Mini App: разворачиваем на весь экран, убираем "съезжание" ──
if(window.Telegram && window.Telegram.WebApp){
  const tg=window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  // expand() разворачивает только до "невсплывающей" высоты, шапка Telegram
  // остаётся видна. Настоящий edge-to-edge fullscreen — отдельный метод,
  // появился в Bot API 8.0, есть не у всех клиентов — поэтому с проверкой.
  if(tg.requestFullscreen) try{tg.requestFullscreen();}catch(e){}
  if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  if(tg.setHeaderColor) try{tg.setHeaderColor('#060402');}catch(e){}
  if(tg.setBackgroundColor) try{tg.setBackgroundColor('#060402');}catch(e){}
  const applyVh=()=>{
    document.documentElement.style.setProperty('--tg-viewport-stable-height',
      (tg.viewportStableHeight||window.innerHeight)+'px');
  };
  // В fullscreen-режиме своей шапки Telegram больше нет, но появляется
  // плавающая кнопка сворачивания сверху и, возможно, вырез/чёлка устройства —
  // contentSafeAreaInset/safeAreaInset сообщают, сколько отступить от края.
  const applySafeArea=()=>{
    const sa=tg.contentSafeAreaInset||tg.safeAreaInset||{};
    document.documentElement.style.setProperty('--tg-safe-top',(sa.top||0)+'px');
    document.documentElement.style.setProperty('--tg-safe-bottom',(sa.bottom||0)+'px');
  };
  applyVh();applySafeArea();
  tg.onEvent('viewportChanged',applyVh);
  tg.onEvent('safeAreaChanged',applySafeArea);
  tg.onEvent('contentSafeAreaChanged',applySafeArea);
}

// ── Сохранение прогресса через бэкенд (Vercel + Supabase) ────────
const API_BASE = 'https://kittyfooda.vercel.app';
let TG_USER = null;
let TG_INIT_DATA = '';
let SESSION_EXPIRED = false;
if(window.Telegram && window.Telegram.WebApp){
  TG_INIT_DATA = window.Telegram.WebApp.initData || '';
  TG_USER = (window.Telegram.WebApp.initDataUnsafe || {}).user || null;
}

// Единая точка запросов к бэкенду: подпись Telegram уходит в заголовке,
// работает и для GET, и для POST. telegram_id сервер берёт из подписи.
async function apiFetch(path, options = {}){
  const headers = Object.assign(
    {'Content-Type':'application/json'},
    options.headers || {},
    TG_INIT_DATA ? {'X-Telegram-Init-Data': TG_INIT_DATA} : {}
  );
  let r;
  try{ r = await fetch(`${API_BASE}${path}`, Object.assign({}, options, {headers})); }
  catch(e){ warnSaveFailed(); throw e; }
  if(r.status === 401){
    SESSION_EXPIRED = true;
    G.msg = 'Сессия устарела — переоткройте игру';
    draw();
  }else if(r.status >= 500){
    warnSaveFailed();
  }
  return r;
}

// Сервер или база недоступны — говорим об этом один раз за сессию,
// иначе сохранения и статистика пропадают молча.
let SAVE_WARNED = false;
function warnSaveFailed(){
  if(SAVE_WARNED || SESSION_EXPIRED) return;
  SAVE_WARNED = true;
  G.msg = '⚠ Нет связи с сервером — прогресс сейчас не сохраняется';
  draw();
}

let PLAYER_STATS={wins:0,losses:0,draws:0}; // накопительная статистика, подгружается из базы

async function syncUser(){
  if(!TG_USER) return null; // не в Telegram — работаем без сохранения
  try{
    // 1) регистрируем/обновляем юзернейм
    await apiFetch('/api/save-progress', { method:'POST', body: JSON.stringify({}) });
    // 2) подгружаем накопленную статистику и сохранённую партию
    const r = await apiFetch('/api/save-progress');
    const data = await r.json();
    if(data.user){
      PLAYER_STATS.wins=data.user.wins||0;
      PLAYER_STATS.losses=data.user.losses||0;
      PLAYER_STATS.draws=data.user.draws||0;
      if(data.user.game_state){
        SAVED_GAME=data.user.game_state;
      }
      hintsOwnedSync(data.user);
    }
    SYNC_DONE=true;
    draw();
    return data.user || null;
  }catch(e){ console.warn('syncUser failed', e); SYNC_DONE=true; return null; }
}

async function saveMatchResult(result, playerScore, aiScore){
  if(!TG_USER||SESSION_EXPIRED) return;
  try{
    if(result==='win') PLAYER_STATS.wins++;
    else if(result==='lose') PLAYER_STATS.losses++;
    else PLAYER_STATS.draws++;
    draw();
    await apiFetch('/api/save-progress', {
      method:'POST',
      body: JSON.stringify({ result })
    });
  }catch(e){ console.warn('saveMatchResult failed', e); }
}
// Купленные подсказки хранятся в базе (users.hints), начисляет их вебхук оплаты
function hintsOwnedSync(user){
  if(user && typeof user.hints === 'number') hintsOwned = user.hints;
}
async function refreshHints(){
  try{
    const r = await apiFetch('/api/save-progress');
    const data = await r.json();
    // Вебхук мог ещё не дойти — не отнимаем только что купленную подсказку.
    // Точное значение придёт из базы при следующем запуске.
    if(data.user && typeof data.user.hints === 'number') hintsOwned = Math.max(hintsOwned, data.user.hints);
    draw();
  }catch(e){ console.warn('refreshHints failed', e); }
}

// Регистрируем/обновляем пользователя сразу при открытии игры
syncUser();

// ── Покупка подсказки через Telegram Stars ────────────────────────
const HINT_PRICE = 15; // звёзд за одну подсказку
let hintsOwned = 0;
let hintActive = null; // индекс подсвеченной карты-подсказки

async function buyHint(){
  if(!TG_USER){ G.msg='Подсказки доступны только в Telegram'; draw(); return; }
  try{
    const r = await apiFetch('/api/create-invoice', {
      method:'POST',
      body: JSON.stringify({ item:'hint' })
    });
    const data = await r.json();
    if(!data.invoice_link){ G.msg='Не удалось создать счёт'; draw(); return; }
    window.Telegram.WebApp.openInvoice(data.invoice_link, (status)=>{
      if(status==='paid'){
        hintsOwned++;
        G.msg='Подсказка куплена! Нажмите 💡 ещё раз, чтобы применить.';
        draw();
        // Начисление делает вебхук на сервере — сверяемся с базой чуть позже
        setTimeout(refreshHints, 3000);
      }
    });
  }catch(e){ console.warn('buyHint failed', e); }
}

function useHint(){
  if(hintsOwned<=0){ buyHint(); return; }
  if(G.phase!=='select'||G.turn!=='player'||!G.pHand.length) return;
  // Простая эвристика: подсвечиваем карту с лучшим immediate-захватом, иначе с наибольшей ценностью
  let bestI=0,bestScore=-Infinity;
  G.pHand.forEach((card,i)=>{
    const matches=G.table.filter(t=>t.m===card.m);
    let s=cardVal(card,G.pCap);
    if(matches.length) s+=50+matches.reduce((a,m)=>a+typeVal(m),0);
    if(s>bestScore){bestScore=s;bestI=i;}
  });
  hintsOwned--;
  apiFetch('/api/save-progress', { method:'POST', body: JSON.stringify({ action:'use_hint' }) })
    .then(r => r.json())
    .then(d => { if(typeof d.hints === 'number'){ hintsOwned = d.hints; draw(); } })
    .catch(e => console.warn('use_hint failed', e));
  hintActive=bestI;
  G.msg=`💡 Подсказка: карта №${bestI+1} слева`;
  draw();
  setTimeout(()=>{hintActive=null;draw();},3000);
}

const cv=document.getElementById('c');
const ct=cv.getContext('2d');
const W=450,H=800;
cv.width=W;cv.height=H;

// ── Размеры карт ─────────────────────────────────────────────────
// 2026-08-23: макет переработан целиком — рука игрока в 2 ряда с
// сортировкой по месяцу (см. playerHandLayout), рука ИИ упакована
// плотно внахлёст в один ряд, колода переехала наверх рядом с рукой
// ИИ (над столом). Карты чуть крупнее (44×66 → 48×72 → 50×74): текст
// и номер месяца — часть готового SVG, растянутого на CW×CH, крупнее
// карта = крупнее текст, CARD_SVG отдельно менять не нужно.
// Фон под стол НЕ ужат до 2 рядов, как в первой версии этой правки —
// проверено headless-симуляцией (sim_koi_lib.js): за 40 партий стол
// реально доходил до 11 карт (частичный 3-й ряд), так что запас на
// 3 ряда — не лишний буфер, а нужный минимум.
const CW=50,CH=74,CG=6;
const HX=10;                         // общий левый отступ (рука ИИ, подписи)
const TX=(W-(5*(CW+CG)-CG))>>1;      // start x стола, 5 колонок

// ── Y-координаты зон ─────────────────────────────────────────────
const YAI  = 64;   // AI cards + колода top
const YTAB = 142;  // Table row 1 top (фон — честный запас на 3 ряда, см. drawTable)
const YCAP = 386;  // Captured summary line
const YPROG= 412;  // Yaku progress panel
const YPH  = 546;  // Player hand top (2 ряда — см. playerHandLayout)
const YMSG = 706;  // Message bar
const YBTN = 762;  // Choice buttons

// ── Игровой стол: раскладка под экран (макет v5, 2026-10-10) ────
// Макет — docs/ui/layout-v5.png. Экран-образец iPhone 15, 1179×2556
// «референсных» px (= физические px этого экрана), размеры — доли экрана.
// Поля: по бокам 4%, сверху и снизу 8% → игровая зона 92% × 84%.
// Карты 3:4, один размер для руки, стола и ИИ (на 5% меньше, чем 2×6 через
// 10 px ровно по зоне). Стол по центру экрана: обычно 2×4, лишние — колонки
// 5–6, сетка остаётся по центру. Колода — справа, зеркально карте ИИ, того же размера.
// Карта хода ИИ и карта из колоды выезжают чуть выше стола (слева/справа).
// Рука 2×4 по центру, под ней полоса «Мяу-Мяу». Над и под столом — место яку.
// k — масштаб реф. px → CSS px; если экран короче нужного, k уменьшается
// по высоте и поле центрируется. Одна boardLayout() — для отрисовки и кликов.
const REF_W=1179;
const SAFE_M=0.04;                 // поле экрана слева и справа
const SAFE_V=0.08;                 // поле экрана сверху и снизу
const SAFE_W=REF_W*(1-2*SAFE_M);   // 1084.7 — ширина игровой зоны
const B_GAP=10;                    // промежуток между картами стола
const TABLE_COLS=6;                // стол 2×6 (обычно занято 2×4)
// 2×6 через 10 ровно по зоне дало бы 172.4; по слову пользователя карта на 5% меньше
const BCW=0.95*(SAFE_W-(TABLE_COLS-1)*B_GAP)/TABLE_COLS; // 163.8
const BCH=BCW*4/3;                 // 218.4 — пропорция 3:4
const HAND_GAP=30;                 // промежуток в руке
const DECK_K=1;                    // колода — того же размера, что карта ИИ
const BAND_H=100;                  // полоса сообщений / «Мяу-Мяу»
const HEADER_H=80;                 // счёт/раунд/💡
const MIN_CELLS=200;               // минимальная высота зоны ячеек яку
const STAGE_UP=0.3;                // карта хода/из колоды — выше стола на 0,3 высоты карты
const DEBUG_INSETS=true;           // временно: метка с отступами Telegram (проверка на телефоне)

let VIEW={cssW:450,cssH:800,dpr:1,k:1,VW:REF_W,VH:2556,ls:1,lx:0,ly:0};
function readTgInsets(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(!tg) return {top:0,bottom:0};
  const a=tg.safeAreaInset||{}, b=tg.contentSafeAreaInset||{};
  return {top:(a.top||0)+(b.top||0), bottom:(a.bottom||0)+(b.bottom||0)};
}
function resizeCanvas(){
  const cssW=window.innerWidth||450, cssH=window.innerHeight||800;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  const insets=readTgInsets();
  // k по ширине; если по высоте не помещается (ячейкам яку < MIN_CELLS) — уменьшаем
  let k=cssW/REF_W;
  for(let i=0;i<40&&boardLayout({k,VW:cssW/k,VH:cssH/k,insets}).cellsGap<MIN_CELLS;i++) k*=0.97;
  const ls=Math.min(cssW/W, cssH/H); // старые экраны (меню, журнал) — 450×800 по центру
  VIEW={cssW,cssH,dpr,k,VW:cssW/k,VH:cssH/k,ls,lx:(cssW-W*ls)/2,ly:(cssH-H*ls)/2,insets};
}
function setBoardTransform(){const v=VIEW;ct.setTransform(v.dpr*v.k,0,0,v.dpr*v.k,0,0);}
function setLegacyTransform(){const v=VIEW;ct.setTransform(v.dpr*v.ls,0,0,v.dpr*v.ls,v.dpr*v.lx,v.dpr*v.ly);}
// Затемнение всего экрана (а не только области 450×800) для попапов
function dimScreen(color){
  ct.save();ct.setTransform(1,0,0,1,0,0);
  ct.fillStyle=color;ct.fillRect(0,0,cv.width,cv.height);
  ct.restore();
}
// Координаты клика → система макета
function toBoard(cx,cy){return {x:cx/VIEW.k, y:cy/VIEW.k};}
function toLegacy(cx,cy){return {x:(cx-VIEW.lx)/VIEW.ls, y:(cy-VIEW.ly)/VIEW.ls};}

function boardLayout(V=VIEW){
  const {VW,VH,k,insets}=V;
  const sx=(VW-SAFE_W)/2;
  const sTop=Math.max(VH*SAFE_V, (insets?insets.top:0)/k);
  const sBot=VH-Math.max(VH*SAFE_V, (insets?insets.bottom:0)/k);
  const band={x:sx,y:sBot-BAND_H,w:SAFE_W,h:BAND_H};
  const handY2=band.y-HAND_GAP-BCH, handY1=handY2-HAND_GAP-BCH;
  const handX=(VW-(4*BCW+3*HAND_GAP))/2;         // рука — по центру экрана
  const ai={x:sx,y:sTop+HEADER_H+B_GAP};
  const dw=BCW*DECK_K, dh=BCH*DECK_K;
  const tableH=2*BCH+B_GAP, stage=BCH*STAGE_UP;   // место над столом под выезжающую карту
  const cellsGap=(handY1-(ai.y+BCH)-tableH-stage-B_GAP)/2;
  const tableY=ai.y+BCH+cellsGap+stage;
  const cp=Math.min(12,Math.max(0,cellsGap)/10);
  return {
    VW,VH,sx,sTop,sBot,handX,band,cellsGap,
    header:{x:sx,y:sTop,w:SAFE_W,h:HEADER_H},
    hint:{x:sx+SAFE_W-200,y:sTop+6,w:200,h:HEADER_H-12},
    ai,
    deck:{x:sx+SAFE_W-dw,y:ai.y+(BCH-dh)/2,w:dw,h:dh},   // зеркально карте ИИ
    stageAI:{x:sx,y:tableY-stage},                       // куда выезжает карта ИИ
    stageDeck:{x:sx+SAFE_W-BCW,y:tableY-stage},          // куда выезжает карта из колоды
    table:{y:tableY,h:tableH},
    felt:{x:VW*0.025,y:tableY-B_GAP,w:VW*0.95,h:tableH+2*B_GAP},
    cellsAI:{x:sx,y:ai.y+BCH+cp,w:SAFE_W,h:cellsGap-2*cp},
    cellsP:{x:sx,y:tableY+tableH+B_GAP+cp,w:SAFE_W,h:cellsGap-2*cp},
    handY1,handY2,
  };
}
// Стол: места 2×6. Сначала 2×4 (ряд 1, ряд 2), потом колонки 5–6. Карта
// держит своё место, новая занимает первое свободное; новые карты одного
// хода — по месяцу. Сетка по центру экрана по числу занятых колонок
// (минимум 4): появилась 5-я колонка — сетка съезжает на полкарты влево.
const TABLE_SLOTS=[0,1,2,3,6,7,8,9,4,10,5,11]; // порядок заполнения сетки 2×6
function tableLayout(L){
  const slot=G.tslot||(G.tslot={});
  const ids=new Set(G.table.map(c=>c.id));
  for(const id in slot) if(!ids.has(+id)) delete slot[id];
  const used=new Set(Object.values(slot));
  [...G.table].filter(c=>slot[c.id]===undefined).sort((a,b)=>a.m-b.m).forEach(c=>{
    const free=TABLE_SLOTS.find(s=>!used.has(s));
    slot[c.id]=free===undefined?12+Object.keys(slot).length:free; used.add(slot[c.id]);
  });
  // Больше 12 карт (редко) — 3 ряда по 6 ужатых карт, по порядку мест
  if(G.table.length>12){
    const sorted=[...G.table].sort((a,b)=>slot[a.id]-slot[b.id]);
    const rows=Math.ceil(sorted.length/TABLE_COLS);
    const h=(L.table.h-(rows-1)*B_GAP)/rows, w=h*BCW/BCH, x0=(L.VW-(TABLE_COLS*w+(TABLE_COLS-1)*B_GAP))/2;
    return sorted.map((card,i)=>({card,w,h,
      x:x0+(i%TABLE_COLS)*(w+B_GAP), y:L.table.y+Math.floor(i/TABLE_COLS)*(h+B_GAP)}));
  }
  const cols=Math.max(4,...G.table.map(c=>slot[c.id]%TABLE_COLS+1));
  const x0=(L.VW-(cols*BCW+(cols-1)*B_GAP))/2;
  return G.table.map(card=>{const s=slot[card.id];
    return {card,w:BCW,h:BCH,x:x0+(s%TABLE_COLS)*(BCW+B_GAP),y:L.table.y+Math.floor(s/TABLE_COLS)*(BCH+B_GAP)};});
}
// Рука игрока — 2 ряда по 4, отсортированы по месяцу. Сам G.pHand не
// переупорядочивается (на индексы завязаны G.sel/hintActive/playerPlay).
function playerHandLayout(L=boardLayout()){
  return G.pHand
    .map((card,i)=>({card,i}))
    .sort((a,b)=>a.card.m-b.card.m||(a.i-b.i))
    .map((e,idx)=>({card:e.card,i:e.i,
      x:L.handX+(idx%4)*(BCW+HAND_GAP),
      y:idx<4?L.handY1:L.handY2}));
}
function choiceButtons(L){
  const b=L.band,w=(b.w-30)/2;
  return {stop:{x:b.x,y:b.y+6,w,h:b.h-12}, koi:{x:b.x+w+30,y:b.y+6,w,h:b.h-12}};
}
const inRect=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;

// Плавный выезд карты: from → to за ms (кривая ease-out). Пока анимация
// идёт, перерисовываем кадр. Ключи, не показанные в кадре, сбрасываются.
const ANIM={}; let animFrame=0;
function slide(key,from,to,ms=320){
  const now=performance.now(), a=ANIM[key]||(ANIM[key]={t0:now});
  a.seen=true;
  const p=Math.min(1,(now-a.t0)/ms), e=1-Math.pow(1-p,3);
  if(p<1&&!animFrame) animFrame=requestAnimationFrame(()=>{animFrame=0;draw();});
  return {x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e, s:from.s+(to.s-from.s)*e};
}
function drawBoard(){
  const L=boardLayout();
  for(const k in ANIM) ANIM[k].seen=false;
  // Сукно стола: 95% ширины, по высоте — 2 ряда стола
  ct.fillStyle='rgba(20,60,30,.35)';
  ct.beginPath();rr(L.felt.x,L.felt.y,L.felt.w,L.felt.h,40);ct.fill();
  drawBoardHeader(L);
  drawYakuPlaceholder(L.cellsAI,G.aCap,'ИИ');
  drawYakuPlaceholder(L.cellsP,G.pCap,'вы');
  drawBoardTable(L);
  drawBoardAI(L);
  drawBoardDeck(L);
  drawBoardHand(L);
  drawBoardBand(L);
  for(const k in ANIM) if(!ANIM[k].seen) delete ANIM[k];
  if(DEBUG_INSETS) drawDebugInsets(L);
}
// Шапка: счёт матча по центру, 💡 справа; слева — отметка «★ Мяу-Мяу», если объявлено
function drawBoardHeader(L){
  const h=L.header,cy=h.y+h.h/2;

    ct.font='bold 30px Georgia';ct.fillStyle='#c9a227';ct.textAlign='left';

  }

  const wy=ct.measureText(you).width, ws=ct.measureText(sep).width, wa=ct.measureText(ai).width;
  let x=h.x+h.w/2-(wy+ws+wa)/2; ct.textAlign='left';
  ct.fillStyle='#f0e8d0';ct.fillText(you,x,cy); x+=wy;
  ct.fillStyle='#c9a227';ct.fillText(sep,x,cy); x+=ws;

function boardClick(p){
  const L=boardLayout();
  if(inRect(p,L.hint)){ useHint(); return; }
  if(G.phase==='captureSelect'&&G.pendingCapture?.owner==='player'){
    for(const t of tableLayout(L)){
      if(inRect(p,{x:t.x,y:t.y,w:t.w,h:t.h})){ playerResolveCapture(t.card.id); return; }
    }
    return;
  }
  if(G.phase==='choose'){
    const {stop,koi}=choiceButtons(L);
    if(inRect(p,stop)) playerChoose(true);
    else if(inRect(p,koi)) playerChoose(false);
    return;
  }
  if(G.phase==='select'&&G.turn==='player'){
    for(const {card,i,x,y} of playerHandLayout(L)){
      const yy=y+(G.sel===i?-30:0);
      if(inRect(p,{x,y:yy-10,w:BCW,h:BCH+20})){
        if(G.sel===i){ playerPlay(i); }
        else{ G.sel=i; G.msg=`Выбрана карта: месяц ${card.m}. Нажмите ещё раз — сыграть`; draw(); }
        return;
      }
    }
    G.sel=null;draw();
  }
}

function buildDeck(){
  const d=[
    {m:1,t:'bright',sub:'crane'},{m:1,t:'ribbon',sub:'poetry'},{m:1,t:'plain'},{m:1,t:'plain'},
    {m:2,t:'animal'},{m:2,t:'ribbon',sub:'poetry'},{m:2,t:'plain'},{m:2,t:'plain'},
    {m:3,t:'bright',sub:'curtain'},{m:3,t:'ribbon',sub:'poetry'},{m:3,t:'plain'},{m:3,t:'plain'},
    {m:4,t:'animal'},{m:4,t:'ribbon'},{m:4,t:'plain'},{m:4,t:'plain'},
    {m:5,t:'animal'},{m:5,t:'ribbon'},{m:5,t:'plain'},{m:5,t:'plain'},
    {m:6,t:'animal',sub:'butterfly'},{m:6,t:'ribbon',sub:'blue'},{m:6,t:'plain'},{m:6,t:'plain'},
    {m:7,t:'animal',sub:'boar'},{m:7,t:'ribbon'},{m:7,t:'plain'},{m:7,t:'plain'},
    {m:8,t:'bright',sub:'moon'},{m:8,t:'animal'},{m:8,t:'plain'},{m:8,t:'plain'},
    {m:9,t:'animal',sub:'sake'},{m:9,t:'ribbon',sub:'blue'},{m:9,t:'plain'},{m:9,t:'plain'},
    {m:10,t:'animal',sub:'deer'},{m:10,t:'ribbon',sub:'blue'},{m:10,t:'plain'},{m:10,t:'plain'},
    {m:11,t:'bright',sub:'rain'},{m:11,t:'animal'},{m:11,t:'ribbon'},{m:11,t:'plain'},
    {m:12,t:'bright'},{m:12,t:'plain'},{m:12,t:'plain'},{m:12,t:'plain'},
  ];
  d.forEach((c,i)=>c.id=i);
  // Проставляем стабильный номер картинки для plain-карт (1,2,3 в рамках месяца)
  const plainCount={};
  d.forEach(c=>{
    if(c.t==='plain'){
      plainCount[c.m]=(plainCount[c.m]||0)+1;
      c.plainIdx=plainCount[c.m];
    }
  });
  return d;
}

// ── Яку ──────────────────────────────────────────────────────────
// Сохраняем выбранные в Kittyfooda стоимости. Чаша саке считается и Animal,
// и Chaff для Kasu — распространённое современное правило Koi-Koi.
function getYaku(cap){
  const B=cap.filter(c=>c.t==='bright');
  const A=cap.filter(c=>c.t==='animal');
  const R=cap.filter(c=>c.t==='ribbon');
  // Канон: саке — животное (Тане, Ханами, Цукими), в Касу НЕ входит.
  const chaffCount=cap.filter(c=>c.t==='plain').length;
  const y=[];
  const hasRain=B.some(c=>c.sub==='rain');
  if(B.length>=5)                    y.push({n:'Гоко',      p:10});
  else if(B.length===4&&!hasRain)    y.push({n:'Сико',       p:8});
  else if(B.length===4&&hasRain)     y.push({n:'Амэ-Сико',  p:7});
  else if(B.length===3&&!hasRain)    y.push({n:'Санко',      p:5});
  if(A.some(c=>c.sub==='boar')&&A.some(c=>c.sub==='deer')&&A.some(c=>c.sub==='butterfly'))
    y.push({n:'Ино-Сика-Тё',p:5});
  const hasCur=B.some(c=>c.sub==='curtain'),hasMoon=B.some(c=>c.sub==='moon');
  const hasSake=A.some(c=>c.sub==='sake');
  if(hasCur&&hasSake)  y.push({n:'Ханами',  p:3});
  if(hasMoon&&hasSake) y.push({n:'Цукими',  p:3});
  const poetry=R.filter(c=>c.sub==='poetry').length;
  const blue  =R.filter(c=>c.sub==='blue').length;
  if(poetry>=3) y.push({n:'Ака-тан', p:5});
  if(blue>=3)   y.push({n:'Ао-тан',  p:5});
  if(R.length>=5) y.push({n:`Тан×${R.length}`,  p:R.length-4});
  if(A.length>=5) y.push({n:`Тане×${A.length}`, p:A.length-4});
  if(chaffCount>=10)y.push({n:`Касу×${chaffCount}`, p:chaffCount-9});
  return y;
}
function yakuPts(y){return y.reduce((s,x)=>s+x.p,0);}
function yakuKey(y){return y.map(x=>`${x.n}:${x.p}`).sort().join('|');}

// Канон: удвоение только за Мяу-Мяу. 7+ ×2 было отсебятиной, убрано.
function scoredPoints(base){
  return (G.koiKoi||G.aKoiKoi)?base*2:base;

function scoreBreakdown(base){
  const parts=[];
  if(G.koiKoi||G.aKoiKoi) parts.push('Мяу-Мяу ×2');
  return parts.length?` (${base}; ${parts.join(', ')})`:'';
}

// ЖУРНАЛ СОБЫТИЙ — плоский JSON, без отрисовки в игре.
// Формат по образцу другого проекта: {version, exportedAt, events:[...]}.
// Каждое решение ИИ пишется со ВСЕМИ рассмотренными вариантами и их
// оценками, не только выбранным — этого не видно на экране ни при
// каком UI, только через экспорт. Хранится в localStorage ЭТОГО
// браузера/устройства, растёт, пока не нажмёшь «Очистить».
// ═══════════════════════════════════════════════════════════════
const EVENT_LOG_KEY='kittyfooda_event_log';
const EVENT_LOG_VERSION='kittyfooda-hanafuda-1';
const EVENT_LOG_MAX=4000; // строки лога — при превышении обрезаются старые

function loadEventLog(){
  try{
    const raw=localStorage.getItem(EVENT_LOG_KEY);
    if(!raw) return [];
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed.events)?parsed.events:[];
  }catch(e){ console.warn('loadEventLog failed',e); return []; }
}
function saveEventLog(events){
  try{
    const trimmed=events.length>EVENT_LOG_MAX?events.slice(events.length-EVENT_LOG_MAX):events;
    localStorage.setItem(EVENT_LOG_KEY, JSON.stringify({version:EVENT_LOG_VERSION,events:trimmed}));
  }catch(e){ console.warn('saveEventLog failed — возможно, localStorage переполнен или недоступен',e); }
}
function logEvent(type,payload){
  const events=loadEventLog();
  events.push(Object.assign({ts:Date.now(),type},payload));
  saveEventLog(events);
}
function eventLogCount(){ return loadEventLog().length; }
function clearEventLog(){ try{ localStorage.removeItem(EVENT_LOG_KEY); }catch(e){} }

// Компактное описание карты для лога — тип/месяц/подтип, без внутренних id
function cardDesc(c){ return c?{t:c.t,m:c.m,sub:c.sub||null}:null; }
function handDesc(hand){ return hand.map(cardDesc); }

function downloadEventLog(){
  const events=loadEventLog();
  const blob=new Blob([JSON.stringify({version:EVENT_LOG_VERSION,exportedAt:new Date().toISOString(),events},null,0)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`kittyfooda_log_${Date.now()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
// Резервный способ на случай, если скачивание файла заблокировано
// внутри Telegram WebView — тогда просто копируем JSON в буфер обмена.
function copyEventLogToClipboard(onDone){
  const events=loadEventLog();
  const text=JSON.stringify({version:EVENT_LOG_VERSION,exportedAt:new Date().toISOString(),events});
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      document.execCommand('copy');document.body.removeChild(ta);
      onDone();
    }catch(e){ console.warn('copy failed',e); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(fallback);
  }else fallback();
}

function monthCounts(cards){
  const c={};
  cards.forEach(x=>c[x.m]=(c[x.m]||0)+1);
  return c;
}
function hasTeshi(cards){return Object.values(monthCounts(cards)).some(n=>n===4);}
function hasKuttsuki(cards){return Object.values(monthCounts(cards)).filter(n=>n===2).length===4;}
function validDeal(deck){
  const p=deck.slice(0,8), a=deck.slice(8,16), t=deck.slice(16,24);
  // Скрыто отбрасываем автоматические/бессодержательные стартовые исходы.
  if(hasTeshi(p)||hasKuttsuki(p)||hasTeshi(a)||hasKuttsuki(a)) return false;
  if(hasTeshi(t)||hasKuttsuki(t)) return false;
  return true;
}

function newRound(){
  let deck;
  do{deck=buildDeck();shuffle(deck);}while(!validDeal(deck));
  const dealer=G.dealer||'player';
  G={...G,phase:'wait',turn:dealer,sel:null,aiCard:null,
    deck:deck.slice(24),pHand:deck.slice(0,8),aHand:deck.slice(8,16),table:deck.slice(16,24),
    pCap:[],aCap:[],prevPts:0,aPrevPts:0,prevYakuKey:'',aPrevYakuKey:'',
    koiKoi:false,aKoiKoi:false,aKoiCount:0,currentYaku:[],
    aiHL:-1,aiTargets:[],aiPreview:null,pendingCapture:null,
    msg:dealer==='player'?'Ваш ход — выберите карту из руки':'Дилер ИИ ходит первым...'};
  if(dealer==='player') G.phase='select';
  logEvent('round_start',{round:G.round,diff:DIFF,dealer,
    playerHand:handDesc(G.pHand),aiHand:handDesc(G.aHand),table:handDesc(G.table)});
  draw();persistState();
  if(dealer==='ai') setTimeout(aiTurnStart,650);
}

// ── Правила захвата ──────────────────────────────────────────────
function captureOptions(card,table=G.table){
  const m=table.filter(c=>c.m===card.m);
  if(m.length===0) return [[]];
  if(m.length===1) return [[m[0].id]];
  if(m.length===2) return [[m[0].id],[m[1].id]];
  return [m.map(c=>c.id)]; // при трёх совпадениях забираются все три
}
function applyCapture(card,pile,captureIds){
  if(!captureIds||!captureIds.length){G.table.push(card);return 0;}
  const ids=new Set(captureIds);
  const taken=G.table.filter(c=>ids.has(c.id));
  G.table=G.table.filter(c=>!ids.has(c.id));
  pile.push(card,...taken);
  return taken.length+1;
}
function captureLabel(n,card){return n?`Захват: ${n} карты месяца ${card.m}`:'Карта на стол';}

function beginPlayerCaptureChoice(card,kind,handIndex,options){
  const ids=options.flat();
  G.pendingCapture={owner:'player',kind,card,handIndex,options};
  G.aiTargets=G.table.filter(c=>ids.includes(c.id));
  G.phase='captureSelect';
  G.msg='Две карты этого месяца на столе — выберите одну для захвата';
  draw();
}
function playerResolveCapture(targetId){
  const p=G.pendingCapture;
  if(!p||p.owner!=='player') return;
  const option=p.options.find(o=>o.includes(targetId));
  if(!option) return;
  if(p.kind==='hand') G.pHand.splice(p.handIndex,1);
  const captured=G.table.filter(c=>option.includes(c.id));
  const n=applyCapture(p.card,G.pCap,option);
  logEvent(p.kind==='hand'?'player_move':'player_draw',
    {round:G.round,card:cardDesc(p.card),captured:handDesc(captured),ambiguousChoice:true,hand:handDesc(G.pHand)});
  G.pendingCapture=null;G.aiTargets=[];G.msg=captureLabel(n,p.card);G.phase='wait';draw();
  if(p.kind==='hand') setTimeout(playerDraw,500);
  else setTimeout(finishPlayerTurn,350);
}

function playerPlay(idx){
  if(G.phase!=='select'||G.turn!=='player')return;
  const card=G.pHand[idx];G.sel=null;
  const opts=captureOptions(card);
  if(opts.length===2){beginPlayerCaptureChoice(card,'hand',idx,opts);return;}
  G.pHand.splice(idx,1);
  const captured=G.table.filter(c=>opts[0].includes(c.id));
  const n=applyCapture(card,G.pCap,opts[0]);
  logEvent('player_move',{round:G.round,card:cardDesc(card),captured:handDesc(captured),hand:handDesc(G.pHand)});
  G.msg=captureLabel(n,card);G.phase='wait';draw();setTimeout(playerDraw,500);
}
function playerDraw(){
  if(!G.deck.length){finishPlayerTurn();return;}
  const card=G.deck[G.deck.length-1];
  G.aiPreview=card;G.aiTargets=G.table.filter(c=>c.m===card.m);
  G.msg=`Из колоды: месяц ${card.m}${G.aiTargets.length?' — совпадение!':' — на стол'}`;draw();
  setTimeout(()=>{
    G.aiPreview=null;G.aiTargets=[];G.deck.pop();
    const opts=captureOptions(card);
    if(opts.length===2){beginPlayerCaptureChoice(card,'draw',-1,opts);return;}
    const captured=G.table.filter(c=>opts[0].includes(c.id));
    const n=applyCapture(card,G.pCap,opts[0]);
    logEvent('player_draw',{round:G.round,card:cardDesc(card),captured:handDesc(captured),hand:handDesc(G.pHand)});
    G.msg=n?`Из колоды: захват ${n} карты месяца ${card.m}`:'Из колоды: карта на стол';draw();
    setTimeout(finishPlayerTurn,350);
  },650);
}
function finishPlayerTurn(){
  const yaku=getYaku(G.pCap),pts=yakuPts(yaku),key=yakuKey(yaku);
  const improved=pts>0&&(pts>G.prevPts||key!==G.prevYakuKey);
  if(improved){
    G.prevPts=pts;G.prevYakuKey=key;G.currentYaku=yaku;G.phase='choose';
    G.msg=`Яку! ${yaku.map(y=>y.n).join(' + ')} = ${pts}. Стоп или Мяу-Мяу?`;draw();return;
  }
  if(!G.pHand.length&&!G.aHand.length){endRound();return;}
  aiTurnStart();
}
function playerChoose(stop){
  const base=yakuPts(G.currentYaku||getYaku(G.pCap));
  logEvent('player_koikoi',{round:G.round,pts:base,decision:stop?'stop':'koikoi'});
  if(stop){
    endRound('player',scoredPoints(base));
  }else{
    G.koiKoi=true;G.phase='wait';G.msg='Мяу-Мяу! Продолжаем...';
    showKoiKoiPopup('player',aiTurnStart);
  }
}

// ── Оценка карт и угроз ──────────────────────────────────────────
// Грубая метрика редкости типа карты — используется только в подсказке
// игроку (useHint), к оценкам ИИ отношения не имеет.
function typeVal(c){return{bright:20,animal:10,ribbon:5,plain:1}[c.t]||0;}

// ═══════════════════════════════════════════════════════════════
// ПОРТФЕЛЬ ЯКУ — единая модель ценности карты для обеих сторон.
//
// Идея: вместо ручных чисел вида «+10 за вторую ленту» считаем для
// каждого фиксированного яку три вещи — сколько элементов уже есть,
// какие конкретно карты недостают, и какова вероятность их достать.
// Ценность карты = насколько она меняет эту сумму. Отсюда бесплатно
// получаются оба нужных свойства: яку, для которого недостающая
// карта уже лежит у противника, обнуляется сам (карта локализована —
// вероятность 0), а карта на пересечении нескольких почти готовых
// яку (как саке при занавесе+луне у игрока) получает их сумму.
//
// Не точная теория вероятностей (независимость карт друг от друга —
// упрощение), а инженерная оценка. Три места калибровки помечены
// ниже; крутятся через headless-прогон, не на глаз.
// ═══════════════════════════════════════════════════════════════
const REF_DECK=buildDeck();
const poolIds=pred=>REF_DECK.filter(pred).map(c=>c.id);
const POOL_BRIGHT =poolIds(c=>c.t==='bright');                       // 5
const POOL_RAIN_ID=poolIds(c=>c.sub==='rain')[0];
const POOL_INO    =poolIds(c=>['boar','deer','butterfly'].includes(c.sub)); // 3
const POOL_AKATAN =poolIds(c=>c.sub==='poetry');                     // 3
const POOL_AOTAN  =poolIds(c=>c.sub==='blue');                       // 3
const POOL_HANAMI =poolIds(c=>c.sub==='curtain'||c.sub==='sake');    // 2
const POOL_TSUKIMI=poolIds(c=>c.sub==='moon'||c.sub==='sake');       // 2
const POOL_RIBBON =poolIds(c=>c.t==='ribbon');                       // 10 (Тан)
const POOL_ANIMAL =poolIds(c=>c.t==='animal');                       // 9  (Тане)
const POOL_PLAIN  =poolIds(c=>c.t==='plain');                        // 24 (Касу, без саке — канон)

// locateCardId зовётся десятки раз на одну оценку хода (по каждой
// недостающей карте каждого пула); кешируем реальное расположение в Map
// на время одной оценки — реальные зоны G не меняются, пока считается
// гипотетический ход, меняется только локальный «cap» в cardVal/blockingValueFor.
let _locMap=null;
function buildLocMap(){
  const m=new Map();
  G.aCap.forEach(c=>m.set(c.id,'ai'));
  G.pCap.forEach(c=>m.set(c.id,'opp'));
  G.aHand.forEach(c=>{if(!m.has(c.id))m.set(c.id,'aiHand');});
  G.table.forEach(c=>{if(!m.has(c.id))m.set(c.id,'table');});
  return m;
}
function locateCardId(id){
  if(!_locMap)_locMap=buildLocMap();
  return _locMap.get(id)||'unknown'; // не в известных зонах — в колоде или руке игрока
}
// Вероятность, что карту id в итоге заберёт сторона side ('ai'|'opp').
// Ключевое: если карта уже в стопке противоположной стороны — 0.
// Калибровка №1: константы для руки/стола/неизвестной массы.
function cardProb(id,side){
  const loc=locateCardId(id);
  if(loc==='ai') return side==='ai'?1:0;
  if(loc==='opp')return side==='opp'?1:0;
  if(loc==='aiHand') return side==='ai'?0.8:0.05;   // только владелец решает, когда сыграть
  if(loc==='table'){
    const myTurn=(G.turn==='ai')===(side==='ai');
    return myTurn?0.58:0.42;                        // чуть выгоднее тому, чей сейчас ход
  }
  // Неизвестная масса: колода + рука соперника. Чем меньше своих
  // оставшихся ходов относительно размера этой массы — тем ниже шанс
  // встретить именно эту карту. Даёт естественное затухание к концу раздачи.
  const U=Math.max(1,unknownCount());
  const chances=side==='ai'?G.aHand.length:G.pHand.length;
  return Math.min(0.5,chances/U);
}
function fixedSetValue(pool,pts,cap,side){
  const owned=pool.filter(id=>cap.some(c=>c.id===id));
  if(owned.length===pool.length) return pts; // уже собрано — точно, не вероятностно
  let p=1;
  for(const id of pool) if(!owned.includes(id)) p*=cardProb(id,side);
  return pts*p;
}
// Очки за яркие по фактическим id набора — зеркалит ветвление getYaku
// один в один (включая то, что Санко засчитывается ТОЛЬКО без дождя —
// «3 ярких, и одна из них дождь» даёт 0, не Санко; см. getYaku).
function brightYakuPoints(ids){
  const n=ids.length;
  if(n>=5) return 10;                                     // Гоко
  const hasRain=ids.includes(POOL_RAIN_ID);
  if(n===4) return hasRain?7:8;                            // Амэ-Сико / Сико
  if(n===3) return hasRain?0:5;                             // (дождь среди 3х — 0) / Санко
  return 0;
}
// Раньше здесь была lerpTable-аппроксимация по общему счётчику E — она
// усредняла Сико/Амэ-Сико на пороге 4, но полностью упускала, что при
// ровно 3 ярких дождь среди них даёт 0, а не Санко (getYaku:267). Пул
// всего 5 карт, поэтому точное мат. ожидание по всем 2^(недостающих)
// комбинациям недостающих карт — дёшево (до 32 веток) и точно, вместо
// приближения.
function brightValue(cap,side){
  const owned=POOL_BRIGHT.filter(id=>cap.some(c=>c.id===id));
  const missing=POOL_BRIGHT.filter(id=>!owned.includes(id));
  if(!missing.length) return brightYakuPoints(owned);
  const probs=missing.map(id=>cardProb(id,side));
  let expected=0;
  for(let mask=0;mask<(1<<missing.length);mask++){
    let p=1;
    const ids=[...owned];
    for(let i=0;i<missing.length;i++){
      if(mask&(1<<i)){p*=probs[i];ids.push(missing[i]);}
      else p*=(1-probs[i]);
    }
    if(p>0) expected+=p*brightYakuPoints(ids);
  }
  return expected;
}
// Тан×N/Тане×N/Касу×N: точное мат. ожидание E[max(0, N−порог)] по
// распределению числа карт (Пуассон-биномиальное, DP по пулу ≤24 карт).
// Было max(0, E[N]−порог) — «ступенька» по среднему: пока ожидаемое
// число ниже порога, каждая карта пула стоила ровно 0, выше — почти
// полное очко. Касу (10 из 24) переваливал порог по среднему раньше,
// чем Тане (5 из 9) и Тан (5 из 10), и ИИ брал/блокировал простые
// вместо животных и лент. См. GAME-STATE.md §5.10.
function progressiveValue(pool,cap,side,threshold){
  let owned=0;
  const probs=[];
  for(const id of pool){
    if(cap.some(c=>c.id===id)) owned++;
    else probs.push(cardProb(id,side));
  }
  let dist=[1];                                   // dist[k] = P(добрать ровно k)
  for(const p of probs){
    const next=new Array(dist.length+1).fill(0);
    for(let k=0;k<dist.length;k++){
      next[k]+=dist[k]*(1-p);
      next[k+1]+=dist[k]*p;
    }
    dist=next;
  }
  let ev=0;
  for(let k=0;k<dist.length;k++){
    const n=owned+k;
    if(n>threshold) ev+=dist[k]*(n-threshold); // порог совпадает с getYaku (см. вызовы)
  }
  return ev;
}
// Полная ожидаемая стоимость портфеля одной стороны в очках яку.
function portfolioValue(cap,side){
  return fixedSetValue(POOL_INO,5,cap,side)
       + fixedSetValue(POOL_AKATAN,5,cap,side)
       + fixedSetValue(POOL_AOTAN,5,cap,side)
       + fixedSetValue(POOL_HANAMI,3,cap,side)
       + fixedSetValue(POOL_TSUKIMI,3,cap,side)
       + brightValue(cap,side)
       + progressiveValue(POOL_RIBBON,cap,side,4)  // Тан×N: порог 5 карт (N-4)
       + progressiveValue(POOL_ANIMAL,cap,side,4)  // Тане×N: порог 5 карт (N-4)
       + progressiveValue(POOL_PLAIN,cap,side,9);  // Касу×N: порог 10 карт (N-9) — было ошибочно -4
}
// Ценность карты для собственного портфеля ИИ — насколько её взятие
// поднимает ожидаемую сумму очков.
function cardVal(card,captured){
  // Базовое значение для ТЕКУЩИХ G.aCap кешируется; если captured — это
  // гипотетическая (не текущая) стопка, считаем честно без кеша.
  const base=(captured===G.aCap)?basePortfolio().ai:portfolioValue(captured,'ai');
  return portfolioValue([...captured,card],'ai')-base;
}
// Ценность карты как БЛОКИРОВКИ — тот же расчёт, но с точки зрения
// портфеля игрока: сколько он теряет, если карта достанется не ему.
// Это то место, где саке при занавесе+луне у игрока получает высокую
// оценку сама по себе — как сумма двух почти готовых яку.
function blockingValueFor(card,cap){
  const base=(cap===G.pCap)?basePortfolio().opp:portfolioValue(cap,'opp');
  return portfolioValue([...cap,card],'opp')-base;
}
// Общая ожидаемая ценность портфеля игрока — используется в решении
// Мяу-Мяу/Стоп как мера того, есть ли у него вообще что терять.
function playerThreatScore(){ return basePortfolio().opp; }
function gamePhase(){return Math.max(0,Math.min(1,(24-G.deck.length)/16));}

function legalMovesForHand(hand,table=G.table){
  const out=[];
  hand.forEach((card,handIndex)=>captureOptions(card,table).forEach(captureIds=>out.push({handIndex,card,captureIds})));
  return out;
}
function captureCardsFor(action,table=G.table){
  const ids=new Set(action.captureIds||[]);return table.filter(c=>ids.has(c.id));
}
function simulateTableAfter(action,table=G.table){
  const ids=new Set(action.captureIds||[]);
  const t=table.filter(c=>!ids.has(c.id));
  if(!action.captureIds.length)t.push(action.card);
  return t;
}
// Единый расчёт: разница ожидаемых очков портфеля ДО и ПОСЛЕ хода —
// одним атомарным diff на карту+все взятые сразу (не по одной!), иначе
// комбинация из двух карт, которая ЗАВЕРШАЕТ яку только вместе
// (например, обе последние поэтические ленты разом), недосчиталась бы.
// SCALE=1: раньше здесь стоял отдельный «×22» поверх сырого прироста
// getYaku — то была вторая, несогласованная шкала очков сверху cardVal.
// Портфель уже сам в единицах ожидаемых очков, второй множитель не нужен.
// fixedSetValue — честное произведение вероятностей недостающих карт,
// но у него есть математическое следствие: маржинальная ценность ПЕРВОЙ
// карты N-карточного набора при 0 собранных — это pts×(произведение
// ОСТАВШИХСЯ N-1 вероятностей). У двухкарточных (Ханами/Цукими) остаётся
// всего один множитель — заметная величина. У трёхкарточных (Ино-Сика-Тё/
// Ака-тан/Ао-тан) остаётся произведение ДВУХ множителей — на порядок
// меньше, хотя карта объективно так же нужна. Формула не ошибается —
// она честно оценивает ПАССИВНЫЙ шанс добрать остальное случайно. Но
// раз уже вложился в набор, дальше его будешь целенаправленно преследовать
// (тот же принцип «активного накопления», что и в HOARD_BIAS_MULT, только
// здесь — про будущие ходы, а не про текущее удержание в руке). Компенсируем
// точечно, только для трёхкарточных (двухкарточные и так работают верно —
// см. GAME-STATE.md §5.7).
const TRIPLE_POOLS=[POOL_INO,POOL_AKATAN,POOL_AOTAN];
// 0 = выключено. Проверено headless self-play на Hard (immediateGain
// используется без MC-надстройки Мастера, тот же механизм, дешевле
// считать) на весах 0.5/1.5/3/6/10, N=200×2 на каждый — дозозависимости
// нет вообще (44-52%, шум в обе стороны). См. GAME-STATE.md §5.7 —
// точечная проверка на реальном примере (лента месяца 1) подтвердила,
// что механизм технически работает как задуман, но агрегированного
// выигрыша в самостоятельной игре не даёт — тот же паттерн, что и
// HAND_EXPOSURE_WEIGHT/CAPTURE_URGENCY_WEIGHT. Не проверено отдельно
// на Мастере (MC-прогон там на порядок дороже) — если включать заново,
// начать с прогона именно на diff=4.
const COMBO_SEED_BONUS=0;
function comboSeedBonus(card,cap){
  let bonus=0;
  for(const pool of TRIPLE_POOLS){
    if(!pool.includes(card.id)) continue;
    if(!pool.some(id=>cap.some(c=>c.id===id))) bonus+=COMBO_SEED_BONUS; // 0 своих в этом пуле ДО захвата
  }
  return bonus;
}
// Общая для aiChooseMove (через hardActionScore/expertBaseScore) И
// aiChooseCaptureIds — обе вызывают immediateGain напрямую, значит
// comboSeedBonus автоматически действует в обоих местах разом, без
// отдельной проводки во второй функции (см. GAME-STATE.md §5.7 —
// раньше выбор при неоднозначном доборе из колоды не видел вообще
// ничего сверх голого portfolioValue-диффа).
function immediateGain(action,cap,table=G.table){
  const taken=captureCardsFor(action,table);
  if(!taken.length) return -cardVal(action.card,cap)*0.18;
  const before=(cap===G.aCap)?basePortfolio().ai:portfolioValue(cap,'ai');
  const after=portfolioValue([...cap,action.card,...taken],'ai');
  let seed=0;
  for(const c of [action.card,...taken]) seed+=comboSeedBonus(c,cap);
  return (after-before)+taken.length*0.5+seed; // +0.5/карту — темп, не яку-ценность
}
function defensiveGain(action){
  const taken=captureCardsFor(action);
  if(taken.length) return taken.reduce((s,c)=>s+blockingValueFor(c,G.pCap),0);
  // Карту без захвата мы выставляем на стол и потенциально отдаём игроку.
  return -blockingValueFor(action.card,G.pCap)*0.8;
}
function normalActionScore(a){return immediateGain(a,G.aCap);}
function hardActionScore(a){
  let s=immediateGain(a,G.aCap)+defensiveGain(a)*0.9;
  const phase=gamePhase();
  if(G.koiKoi) s+=defensiveGain(a)*0.45;
  if(phase>0.65) s+=defensiveGain(a)*0.35;
  return s;
}

function publicUnknownCards(){
  const knownIds=new Set([...G.aHand,...G.table,...G.aCap,...G.pCap].map(c=>c.id));
  return REF_DECK.filter(c=>!knownIds.has(c.id)); // REF_DECK — общий эталон, не пересоздаём колоду
}
// Портфель зовёт publicUnknownCards().length на каждую недостающую карту
// каждого пула при оценке каждого хода — кешируем на время одной оценки,
// сбрасывается перед каждым вызовом aiChooseMove/expertSimulationScore.
let _unknownCountCache=null;
function unknownCount(){
  if(_unknownCountCache==null){
    const knownIds=new Set([...G.aHand,...G.table,...G.aCap,...G.pCap].map(c=>c.id));
    _unknownCountCache=REF_DECK.reduce((n,c)=>n+(knownIds.has(c.id)?0:1),0);
  }
  return _unknownCountCache;
}
// portfolioValue(G.aCap/'ai') и (G.pCap/'opp') в исходном виде запрашиваются
// заново на каждого кандидата хода и на каждый сэмпл симуляции, хотя сами
// стопки не меняются в пределах одной оценки — кешируем базовые значения.
let _basePortfolio=null;
function basePortfolio(){
  if(!_basePortfolio) _basePortfolio={ai:portfolioValue(G.aCap,'ai'),opp:portfolioValue(G.pCap,'opp')};
  return _basePortfolio;
}
function invalidateUnknownCache(){ _unknownCountCache=null; _locMap=null; _basePortfolio=null; }
function bestCaptureOptionForCard(card,table,cap,defCap=null){
  const opts=captureOptions(card,table);
  let best=opts[0],bs=-Infinity;
  const before=(cap===G.aCap)?basePortfolio().ai:portfolioValue(cap,'ai');
  for(const ids of opts){
    const taken=table.filter(c=>ids.includes(c.id));
    let s;
    if(!ids.length) s=-cardVal(card,cap)*0.12;
    else{
      const after=portfolioValue([...cap,card,...taken],'ai');
      s=(after-before)+taken.length*0.5;
      if(defCap) s+=taken.reduce((x,c)=>x+blockingValueFor(c,defCap),0)*0.7;
    }
    if(s>bs){bs=s;best=ids;}
  }
  return {ids:best,score:bs};
}
// ── Expert: какие месяцы ещё «живы» ──────────────────────────────
// ИИ видит стол, обе стопки захвата и свою руку. Если все 4 карты месяца
// уже там, карта этого месяца в руке никогда не захватит — это балласт.
function seenMonthCounts(){
  const cnt={};
  const add=c=>cnt[c.m]=(cnt[c.m]||0)+1;
  G.table.forEach(add);G.aCap.forEach(add);G.pCap.forEach(add);G.aHand.forEach(add);
  return cnt;
}
function isDeadCard(card,counts,table){
  return (4-(counts[card.m]||0))<=0 && !table.some(t=>t.m===card.m);
}
// Насколько срочно забирать карту СО СТОЛА прямо сейчас, а не откладывать.
// Не хардкод «всё видно/не видно» — гипергеометрическая оценка через уже
// существующие unknownCount()/G.pHand.length, тот же принцип, что и весь
// остальной портфель. unseen — сколько карт этого месяца ещё нигде не
// видны (могут быть и в колоде, и в руке игрока) — 0 значит гарантированно
// не у игрока (см. пример: 2 карты месяца в руке ИИ + 2 на столе — все 4
// учтены, риска нет вообще). При unseen>0 оцениваем вероятность, что ХОТЯ
// БЫ ОДНА из непросмотренных карт этого месяца лежит именно в руке
// игрока (а не в колоде) — если так, он может перехватить эту же карту
// на своём ходу раньше, чем мы вернёмся к этому месяцу.
// «Копящиеся» карты — было: узкий кураторский список пулов (яркие/
// Ино-Сика-Тё/Ака-тан/Ао-тан/Ханами/Цукими). Разбор реальных логов
// (см. GAME-STATE.md §5.6/§5.7) показал, что этот список неоднороден:
// Ака-тан у пользователя ловится сильно чаще, чем у ИИ (8:1) — реальный
// осознанный приоритет; Ао-тан — почти как у ИИ (3:4) — не самостоятельная
// цель, а побочный эффект того, что 2 из 3 её месяцев (6, 10) совпадают
// с месяцами Ино-Сика-Тё, синяя лента залетает попутно вместе со зверем.
// Кураторский список пришлось бы разбивать на пулы с разными весами —
// лишние свободные параметры при одной реальной серии калибровки.
// 2026-09-13: упростили в другую сторону — вместо конкретных пулов
// просто ЛЮБАЯ карта не типа "plain" (лента/животное/яркая) считается
// «непростой» и получает небольшой перевес против простых карт. Грубее,
// зато без риска захардкодить именно те пулы, что показали сигнал в
// ЭТОЙ конкретной выборке партий — пользователь проверяет вживую.
function isHoardType(card){return card.t!=='plain';}
// Множитель доли «в руке игрока, а не в колоде» для непростых карт.
// Было 1.5 (для узкого списка пулов, см. историю выше) — при переходе
// на «все непростые карты» (почти половина колоды, а не узкий список)
// снижено до 1.2, чтобы не быть слишком агрессивным на таком широком
// классе. Self-play это не откалибрует (см. GAME-STATE.md §5.6) —
// единственная проверка реальные партии. Чтобы сравнить с/без, верните
// сюда 1 на несколько партий и сравните ощущения.
const HOARD_BIAS_MULT=1.2;
function oppMightSnipeMonth(month,counts){
  const unseen=4-(counts[month]||0);
  if(unseen<=0) return 0;
  const U=Math.max(1,unknownCount());
  const baseShare=G.pHand.length/U; // доля руки игрока в общей неизвестной массе
  const known=new Set([...G.aHand,...G.table,...G.aCap,...G.pCap].map(c=>c.id));
  const unseenCards=REF_DECK.filter(c=>c.m===month&&!known.has(c.id));
  let pNone=1;
  for(const c of unseenCards){
    const share=Math.min(0.97,baseShare*(isHoardType(c)?HOARD_BIAS_MULT:1));
    pNone*=(1-share);
  }
  return 1-pNone;
}
// Учёт собственной руки: чем сбрасываем и что после этого остаётся.
// Вес регрета за отдачу «живой» карты — в тех же портфельных очках,
// что и весь остальной расчёт (см. ниже, было −unseen×1.6).
const HAND_SYNERGY_REGRET_WEIGHT=9;
function handSynergy(action){
  if(action.handIndex==null) return 0;
  const counts=seenMonthCounts();
  const rest=G.aHand.filter((_,i)=>i!==action.handIndex);
  let v=0;
  if(!action.captureIds.length){
    const unseen=4-(counts[action.card.m]||0);
    const pairOnTable=G.table.some(t=>t.m===action.card.m);
    if(unseen<=0&&!pairOnTable) v+=8.5;                      // сбросили труп — отлично
    else{
      // Раньше здесь стоял грубый -unseen*1.6, забивавший тонкий портфельный
      // расчёт в трети решений (см. GAME-STATE.md, «Известная проблема»).
      // Теперь используем ту же cardVal, что и весь остальной портфель —
      // согласованная шкала вместо конкурирующей.
      v-=cardVal(action.card,G.aCap)*HAND_SYNERGY_REGRET_WEIGHT;
      if(rest.some(c=>c.m===action.card.m)) v-=3.6;          // рвём свою пару
    }
  }
  // Стол ПОСЛЕ этого хода, не текущий — иначе карта, которая мертвеет
  // именно из-за ЭТОГО захвата (забрали последнюю карту месяца X со
  // стола, а в руке осталась ещё одна карта месяца X), не штрафуется
  // на ход раньше, чем должна: counts[month] сама сумма по всем зонам
  // не меняется от перекладывания карты между зонами, а вот наличие
  // карты месяца именно НА СТОЛЕ — меняется, и isDeadCard смотрит
  // именно на это.
  const tableAfter=simulateTableAfter(action);
  for(const c of rest){
    if(isDeadCard(c,counts,tableAfter)) v-=3.2;
    // Ещё формально не мертва (isDeadCard бинарна: «все 4 учтены» —
    // иначе штрафа нет вообще), но если недостающий экземпляр её месяца
    // скорее всего именно у игрока (а не в колоде) — она рискует либо
    // остаться сиротой, либо при вынужденном будущем сбросе тут же
    // уйти игроку тем же ходом. Переиспользуем oppMightSnipeMonth/
    // blockingValueFor (см. §5.2) — тот же принцип, что и премия за
    // срочность захвата, но с другой стороны хода: не «стоит ли забрать
    // со стола сейчас», а «чем рискует карта, которую я оставляю в руке
    // при ЭТОМ конкретном ходе». Не хардкод — общая переоценка любой
    // ещё живой карты в hand, не только участника текущего неоднозначного
    // захвата.
    else v-=oppMightSnipeMonth(c.m,counts)*blockingValueFor(c,G.pCap)*HAND_EXPOSURE_WEIGHT;
  }
  return v;
}
// Вес риска «оставшаяся в руке карта достанется игроку» (см. выше).
// 2026-09-13: пользователь указал на реальный баг в самой логике, не
// только в формулировке. `rest` — рука МИНУС именно та карта, которую
// разыгрывает КОНКРЕТНОЕ действие (см. handSynergy выше). Значит для
// любого хода штраф получают все карты, кроме сыгранной сейчас — то
// есть при выборе МЕЖДУ разными картами руки этот терм систематически
// поощряет разыграть ценную/копящуюся карту раньше (чтобы убрать её из
// «rest» и не платить штраф), а не придержать её, пока не появится шанс
// захвата. Это прямо противоположно реальному поведению («ты держишь
// ценные карты до возможности взять, если возможность есть — берёшь, но
// не сбрасываешь») — риск перехвата карты, СИДЯЩЕЙ В РУКЕ, ещё и заметно
// меньше риска потерять то, что уже открыто НА СТОЛЕ (это уже отдельно
// покрыто CAPTURE_URGENCY_WEIGHT ниже). Оставлено выключенным намеренно,
// не как «недокалиброванное» — как неверно сформулированное; включать
// только после переработки (например: штраф не за наличие в rest, а за
// вынужденный будущий сброс без возможности захвата).
const HAND_EXPOSURE_WEIGHT=0;
// Базовая оценка Expert. Отдельно от hardActionScore, чтобы веса
// защиты не учитывались дважды при сложении с симуляцией.
// Expert взвешивает защиту сильнее Hard (1.5 против 0.9), и вдобавок
// получает НЕЛИНЕЙНУЮ надбавку за особо крупные блокировки: чем ближе
// чужой яку к завершению, тем выше сам defensiveGain (это не отдельная
// метрика «близости» — она уже зашита в портфельный diff, как в тесте
// с саке при занавесе+луне у игрока), а выпуклый бонус усиливает именно
// такие случаи ещё сильнее сверх линейного веса.
// Премия за срочность блокировки: ожидаемая потеря, если отложить этот
// захват — вероятность, что игрок перехватит карту (oppMightSnipeMonth),
// умноженная на то, сколько мы теряем, если она всё-таки уйдёт к нему
// (blockingValueFor). Гарантированные захваты (месяц весь учтён — не
// срочно, можно взять и позже) премии не получают.
// Проверено headless-прогоном (см. GAME-STATE.md §5.2): на weight=1
// N=300 дал 52.7% (слабый плюс), на weight=2 N=300 дал 49.3% (шум) —
// эффект не масштабируется с весом, значит шум, не сигнал. Но это было
// ДО HOARD_BIAS_MULT — oppMightSnipeMonth считал риск без перекоса на
// копящиеся карты, и self-play всё равно ничего не покажет для версии
// с перекосом (боты не копят карты по-человечески). 2026-09-13: включено
// на минимальное значение для игровой проверки. Отдельного веса по типу
// карты не нужно — blockingValueFor(card,G.pCap) уже сам по себе даёт
// маленькое значение для простых карт (почти не двигают portfolioValue)
// и заметно большее для ценных/копящихся (двигают яку) — премия за
// срочность и так масштабируется по ценности карты автоматически.
const CAPTURE_URGENCY_WEIGHT=0.3;
// Множитель числа Monte-Carlo сэмплов в expertSimulationScore (см. ниже) —
// калибруется headless-прогоном, см. GAME-STATE.md §5.3. 1 = без изменений.
const MC_SAMPLE_MULT=1;
function captureUrgencyBonus(a){
  const taken=captureCardsFor(a);
  if(!taken.length) return 0;
  const counts=seenMonthCounts();
  // Чем раньше в раздаче, тем больше ещё будет ходов (своих и чужих) —
  // и у игрока больше шансов со временем добрать недостающую карту месяца
  // из колоды (не только из уже розданной руки), и у нас будет меньше
  // оставшихся возможностей вернуться за этой картой позже. Оценка снипа
  // выше — «здесь и сейчас», без проекции будущих раздач; масштабируем
  // премию по оставшемуся времени раздачи (gamePhase), с нижним полом —
  // риск не обнуляется целиком даже в самом конце.
  const timeLeft=Math.max(0.3,1-gamePhase());
  return taken.reduce((s,c)=>s+oppMightSnipeMonth(c.m,counts)*blockingValueFor(c,G.pCap),0)*timeLeft;
}
function expertBaseScore(a){
  const phase=gamePhase();
  const def=defensiveGain(a);
  let s=immediateGain(a,G.aCap)+def*1.5+Math.max(0,def-2)*1.3;
  s+=captureUrgencyBonus(a)*CAPTURE_URGENCY_WEIGHT;
  if(G.koiKoi) s+=def*0.6;
  if(phase>0.65) s+=def*0.35;
  return s+handSynergy(a);
}
// Противник держит целую руку и играет ЛУЧШЕЙ картой, а не случайной.
// Берём максимум по нескольким пробам — иначе угроза занижается в разы.
function opponentBestResponse(table,oppCap,myCap,unknown,k){
  let best=-Infinity;
  const n=Math.max(1,Math.min(k,unknown.length));
  for(let i=0;i<n;i++){
    const c=unknown[(Math.random()*unknown.length)|0];
    const s=bestCaptureOptionForCard(c,table,oppCap,myCap).score;
    if(s>best)best=s;
  }
  return Math.max(0,best);
}
function expertSimulationScore(action){
  const unknown=publicUnknownCards();
  if(!unknown.length) return expertBaseScore(action);
  const baseTable=simulateTableAfter(action);
  const baseCap=[...G.aCap];
  const taken=captureCardsFor(action);
  if(taken.length)baseCap.push(action.card,...taken);

  // Эндшпиль: неизвестных мало — перебираем их все, без случайности
  const exact=unknown.length<=10;
  // После кеширования портфеля вычисления заметно подешевели — увеличиваем
  // глубину взгляда вперёд, это чисто Expert-эксклюзивное преимущество.
  // Множитель — не хардкод конкретных чисел, а система весов для калибровки
  // (см. GAME-STATE.md §5.3): базовые 42/70 сэмплов дают заметный Monte-Carlo
  // шум при сравнении близких кандидатов, что могло маскировать реальную
  // разницу между кандидатами шумом оценки, а не отсутствием разницы.
  const samples=exact?unknown.length:Math.round((gamePhase()>0.6?70:42)*MC_SAMPLE_MULT);
  const oppK=Math.min(6,Math.max(1,G.pHand.length));

  let total=0;
  for(let k=0;k<samples;k++){
    const drawCard=exact?unknown[k]:unknown[(Math.random()*unknown.length)|0];
    const dc=bestCaptureOptionForCard(drawCard,baseTable,baseCap,G.pCap);
    const drawTaken=baseTable.filter(c=>dc.ids.includes(c.id));
    let table2=baseTable.filter(c=>!dc.ids.includes(c.id));
    const cap2=[...baseCap];
    if(dc.ids.length)cap2.push(drawCard,...drawTaken);else table2=[...table2,drawCard];
    total+=dc.score*0.55-opponentBestResponse(table2,G.pCap,cap2,unknown,oppK)*0.5;
  }
  return expertBaseScore(action)+total/samples;
}

// ═══════════════════════════════════════════════════════════════
// МАСТЕР — PIMC (Monte-Carlo с подстановкой скрытых карт).
//
// ИИ не знает руку игрока и порядок колоды. Для каждого решения он
// много раз «раздаёт» неизвестные карты (совместимо со всем видимым)
// и доигрывает раунд до конца по настоящим правилам быстрой простой
// политикой за обе стороны. Выбирается вариант с лучшим средним итогом
// раунда в очках. Все варианты проверяются на ОДНИХ И ТЕХ ЖЕ мирах —
// разница между ними не тонет в везении раздачи.
//
// Руку игрока читает только как число карт. Время ограничено
// PIMC_BUDGET_MS: быстрый телефон успеет больше миров (до PIMC_MAX_WORLDS),
// слабый — меньше (не меньше PIMC_MIN_WORLDS), но не тормозит.
// Headless (GAME-STATE.md §5.11): vs прежний Мастер 68% (N=150),
// vs Hard 63% (200 миров) / 70.5% (1000 миров), N=200.
// ═══════════════════════════════════════════════════════════════
const PIMC_BUDGET_MS=250;
const PIMC_MIN_WORLDS=40;
const PIMC_MAX_WORLDS=1000;
const PIMC_M=[],PIMC_T=[],PIMC_SUB=[];
REF_DECK.forEach(c=>{PIMC_M[c.id]=c.m;PIMC_T[c.id]=c.t;PIMC_SUB[c.id]=c.sub||'';});

// Очки яку по id карт — зеркало getYaku (сверено на 200 000 случайных наборов)
function pimcYakuPts(cap){
  let B=0,rain=false,cur=false,moon=false,sake=false,boar=false,deer=false,bfly=false;
  let A=0,R=0,poetry=0,blue=0,P=0;
  for(const id of cap){
    const t=PIMC_T[id],s=PIMC_SUB[id];
    if(t==='bright'){B++;if(s==='rain')rain=true;if(s==='curtain')cur=true;if(s==='moon')moon=true;}
    else if(t==='animal'){A++;if(s==='sake')sake=true;if(s==='boar')boar=true;if(s==='deer')deer=true;if(s==='butterfly')bfly=true;}
    else if(t==='ribbon'){R++;if(s==='poetry')poetry++;if(s==='blue')blue++;}
    else P++;
  }
  let p=0;
  if(B>=5)p+=10;else if(B===4)p+=rain?7:8;else if(B===3&&!rain)p+=5;
  if(boar&&deer&&bfly)p+=5;
  if(cur&&sake)p+=3;
  if(moon&&sake)p+=3;
  if(poetry>=3)p+=5;
  if(blue>=3)p+=5;
  if(R>=5)p+=R-4;
  if(A>=5)p+=A-4;
  if(P>=10)p+=P-9;
  return p;
}
// Политика доигрывания: грубая ценность карты по типу
function pimcVal(id){
  const t=PIMC_T[id],s=PIMC_SUB[id];
  if(t==='bright')return s==='rain'?4:6;
  if(t==='animal')return(s==='boar'||s==='deer'||s==='butterfly'||s==='sake')?4:2;
  if(t==='ribbon')return(s==='poetry'||s==='blue')?3.5:2;
  return 1;
}
function pimcCaptureOpts(id,table){
  const m=PIMC_M[id],same=[];
  for(const t of table)if(PIMC_M[t]===m)same.push(t);
  if(same.length===0)return[[]];
  if(same.length===2)return[[same[0]],[same[1]]];
  return[same];
}
function pimcBestOpt(id,table){
  const os=pimcCaptureOpts(id,table);
  if(os.length===1)return os[0];
  return pimcVal(os[0][0])>=pimcVal(os[1][0])?os[0]:os[1];
}
function pimcApply(st,side,id,ids){
  if(!ids.length){st.table.push(id);return;}
  st.table=st.table.filter(t=>!ids.includes(t));
  st.caps[side].push(id,...ids);
}
function pimcPolicyPlay(st,side){
  const hand=st.hands[side];
  let bi=0,bs=-Infinity,bids=null;
  for(let i=0;i<hand.length;i++){
    const ids=pimcBestOpt(hand[i],st.table);
    let s;
    if(ids.length){s=10+pimcVal(hand[i]);for(const t of ids)s+=pimcVal(t);}
    else s=-pimcVal(hand[i]);
    if(s>bs){bs=s;bi=i;bids=ids;}
  }
  const id=hand[bi];
  hand.splice(bi,1);
  pimcApply(st,side,id,bids);
}
function pimcDraw(st,side){
  if(!st.deck.length)return;
  const id=st.deck.pop();
  pimcApply(st,side,id,pimcBestOpt(id,st.table));
}
// null — раунд продолжается; число — итог раунда для ИИ (side 0), со знаком
function pimcYakuCheck(st,side){
  const pts=pimcYakuPts(st.caps[side]);
  if(pts>st.prev[side]){
    st.prev[side]=pts;
    const koi=pts<=2&&st.hands[side].length>=4;
    if(!koi)return(side===0?1:-1)*pts*(st.koi[0]||st.koi[1]?2:1);
    st.koi[side]=true;
  }
  return null;
}
function pimcExhaust(st){return pimcYakuPts(st.caps[0])-pimcYakuPts(st.caps[1]);}
// phase: 'aiDraw' — после хода с руки ИИ ещё добирает; 'aiYaku' — после добора;
// 'oppTurn' — ход игрока (после Мяу-Мяу ИИ)
function pimcPlayout(st,phase){
  let side;
  if(phase==='aiDraw'){pimcDraw(st,0);const r=pimcYakuCheck(st,0);if(r!=null)return r;side=1;}
  else if(phase==='aiYaku'){const r=pimcYakuCheck(st,0);if(r!=null)return r;side=1;}
  else side=1;
  for(;;){
    if(!st.hands[side].length)return pimcExhaust(st);
    pimcPolicyPlay(st,side);
    pimcDraw(st,side);
    const r=pimcYakuCheck(st,side);
    if(r!=null)return r;
    if(!st.hands[0].length&&!st.hands[1].length)return pimcExhaust(st);
    side^=1;
  }
}
function pimcBase(excludeIds=[]){
  const ids=cs=>cs.map(c=>c.id);
  const b={aHand:ids(G.aHand),table:ids(G.table),aCap:ids(G.aCap),pCap:ids(G.pCap),
    pHandN:G.pHand.length,deckN:G.deck.length,
    koi:[!!G.aKoiKoi,!!G.koiKoi],prev:[G.aPrevPts||0,G.prevPts||0]};
  // Учёт счёта партии: сколько каждой стороне не хватает до победы
  const target=G.targetScore||TARGET_SCORE,sc=G.scores||[0,0];
  b.needA=Math.max(1,target-sc[1]);b.needO=Math.max(1,target-sc[0]);
  const known=new Set([...b.aHand,...b.table,...b.aCap,...b.pCap,...excludeIds]);
  b.unknown=REF_DECK.map(c=>c.id).filter(id=>!known.has(id));
  return b;
}
function pimcWorld(b){
  const u=b.unknown.slice();
  for(let i=u.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[u[i],u[j]]=[u[j],u[i]];}
  return{pHand:u.slice(0,b.pHandN),deck:u.slice(b.pHandN,b.pHandN+b.deckN)};
}
function pimcState(b,w){
  return{hands:[b.aHand.slice(),w.pHand.slice()],deck:w.deck.slice(),table:b.table.slice(),
    caps:[b.aCap.slice(),b.pCap.slice()],koi:b.koi.slice(),prev:b.prev.slice()};
}
// Итог раунда → полезность с учётом счёта партии: очки сверх того, что
// нужно до TARGET_SCORE, ничего не стоят (партия всё равно кончается).
// Не подгоночный вес — прямое следствие правила «игра до N очков».
function pimcUtil(r,b){return r>=0?Math.min(r,b.needA):-Math.min(-r,b.needO);}
// Общий цикл: для каждого мира прогоняет все варианты (evalFn(state,k) → итог).
function pimcRun(b,nOpts,evalFn){
  const t0=Date.now(),sum=new Array(nOpts).fill(0);
  let worlds=0;
  while(worlds<PIMC_MAX_WORLDS&&(worlds<PIMC_MIN_WORLDS||Date.now()-t0<PIMC_BUDGET_MS)){
    const w=pimcWorld(b);
    for(let k=0;k<nOpts;k++)sum[k]+=pimcUtil(evalFn(pimcState(b,w),k),b);
    worlds++;
  }
  return{avg:sum.map(s=>s/worlds),worlds,ms:Date.now()-t0};
}
function pimcChooseMove(){
  const b=pimcBase();
  const moves=[];
  b.aHand.forEach((id,hi)=>pimcCaptureOpts(id,b.table).forEach(c=>moves.push({hi,id,c})));
  const toMove=mv=>({handIndex:mv.hi,card:G.aHand[mv.hi],captureIds:mv.c});
  if(moves.length===1)return toMove(moves[0]);
  const r=pimcRun(b,moves.length,(st,k)=>{
    const mv=moves[k];
    st.hands[0].splice(mv.hi,1);
    pimcApply(st,0,mv.id,mv.c);
    return pimcPlayout(st,'aiDraw');
  });
  let bk=0;for(let k=1;k<moves.length;k++)if(r.avg[k]>r.avg[bk])bk=k;
  logEvent('ai_move_decision',{round:G.round,diff:DIFF,engine:'pimc',worlds:r.worlds,ms:r.ms,
    candidates:moves.map((mv,k)=>({card:cardDesc(G.aHand[mv.hi]),capture:mv.c.length>0,captureCount:mv.c.length,score:+r.avg[k].toFixed(3)})),
    chosenIndex:bk});
  return toMove(moves[bk]);
}
function pimcChooseCaptureIds(card){
  const b=pimcBase([card.id]); // добранная карта уже не в неизвестных
  const os=pimcCaptureOpts(card.id,b.table);
  if(os.length===1)return os[0];
  const r=pimcRun(b,os.length,(st,k)=>{pimcApply(st,0,card.id,os[k]);return pimcPlayout(st,'aiYaku');});
  const bk=r.avg[1]>r.avg[0]?1:0;
  logEvent('ai_capture_choice',{round:G.round,diff:DIFF,engine:'pimc',worlds:r.worlds,ms:r.ms,card:cardDesc(card),
    candidates:os.map((ids,k)=>({captureIds:ids.map(id=>cardDesc(REF_DECK[id])),score:+r.avg[k].toFixed(3)})),
    chosenIndex:bk});
  return os[bk];
}
function pimcShouldKoiKoi(pts){
  const stopNow=pts*(G.koiKoi||G.aKoiKoi?2:1);
  if(!G.aHand.length){
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,engine:'pimc',pts,stopNow,decision:'stop',reason:'no_cards'});
    return false;
  }
  const b=pimcBase();
  b.prev[0]=pts;
  const r=pimcRun(b,1,st=>{st.koi[0]=true;return pimcPlayout(st,'oppTurn');});
  const d=r.avg[0]>pimcUtil(stopNow,b);
  logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,engine:'pimc',pts,stopNow,
    evContinue:+r.avg[0].toFixed(2),needAi:b.needA,needPlayer:b.needO,worlds:r.worlds,ms:r.ms,decision:d?'koikoi':'stop'});
  return d;
}

// ── Четыре уровня ИИ ─────────────────────────────────────────────
function aiChooseMove(){
  invalidateUnknownCache(); // состав известного не меняется внутри одной оценки хода
  const moves=legalMovesForHand(G.aHand);
  if(!moves.length)return null;
  if(DIFF===1) return moves[(Math.random()*moves.length)|0];
  if(DIFF===4) return pimcChooseMove();
  let best=moves[0],bs=-Infinity,bi=0;
  const scored=moves.map((m,i)=>{
    const s=DIFF===2?normalActionScore(m):DIFF===3?hardActionScore(m):expertSimulationScore(m);
    if(s>bs){bs=s;best=m;bi=i;}
    return {card:cardDesc(m.card),capture:m.captureIds.length>0,captureCount:m.captureIds.length,score:+s.toFixed(3)};
  });
  // Пишем событие только когда был реальный выбор — единственный
  // легальный ход не решение, а вынужденный ход.
  if(moves.length>1){
    logEvent('ai_move_decision',{round:G.round,diff:DIFF,phase:+gamePhase().toFixed(2),candidates:scored,chosenIndex:bi});
  }
  return best;
}
function aiChooseCaptureIds(card){
  invalidateUnknownCache();
  const opts=captureOptions(card);
  if(opts.length===1)return opts[0];
  if(DIFF===1)return opts[(Math.random()*opts.length)|0];
  if(DIFF===4)return pimcChooseCaptureIds(card);
  let best=opts[0],bs=-Infinity,bi=0;
  const scored=opts.map((ids,i)=>{
    const a={card,captureIds:ids};
    let s=immediateGain(a,G.aCap);
    if(DIFF===3) s+=defensiveGain(a)*0.85;               // Hard — без изменений
    else if(DIFF===4){                                    // Expert — тот же принцип, что в expertBaseScore
      const def=defensiveGain(a);
      s+=def*1.5+Math.max(0,def-2)*1.3;
      s+=captureUrgencyBonus(a)*CAPTURE_URGENCY_WEIGHT; // та же премия за срочность, что и в expertBaseScore — иначе двойной стандарт между обычным ходом и неоднозначным захватом из колоды
    }
    if(s>bs){bs=s;best=ids;bi=i;}
    return {captureIds:ids.map(id=>{const c=G.table.find(t=>t.id===id);return c?cardDesc(c):null;}),score:+s.toFixed(3)};
  });
  logEvent('ai_capture_choice',{round:G.round,diff:DIFF,card:cardDesc(card),candidates:scored,chosenIndex:bi});
  return best;
}

function nearCompletionBonus(cap=G.aCap){
  let b=0;
  const ist=['boar','deer','butterfly'].filter(s=>cap.some(c=>c.sub===s)).length;if(ist===2)b+=4.5;
  const po=cap.filter(c=>c.sub==='poetry').length;if(po===2)b+=4;
  const bl=cap.filter(c=>c.sub==='blue').length;if(bl===2)b+=4;
  const br=cap.filter(c=>c.t==='bright'&&c.sub!=='rain').length;if(br===2)b+=3;if(br===3)b+=4;
  const sake=cap.some(c=>c.sub==='sake');
  if(sake&&!cap.some(c=>c.sub==='curtain'))b+=2.5;if(sake&&!cap.some(c=>c.sub==='moon'))b+=2.5;
  return b;
}

// Выплата без обращения к глобальным флагам — нужна для сравнения сценариев.
function payout(base,doubled){ return doubled?base*2:base; }
// Ключевой момент правил Kittyfooda: при исчерпании рук раунд не сгорает,
// а достаётся тому, у кого яку дороже. Значит Мяу-Мяу с сильным яку
// гораздо безопаснее, чем в классических правилах.
//
// Решение строится в ОДНИХ единицах — ожидаемых очках портфеля — для
// обеих сторон. Отсюда бесплатно получается нужное поведение: если у
// игрока портфель почти пуст (ему нечего собирать), риск продолжения
// у нас низкий и «взять яку и стоп» само по себе не станет предпочтительнее
// без явного правила — сравнение чисел решает это само.
// Калибровка №2: сила ответной реакции противника (weightOpp ниже).
let LAST_KOI_BREAKDOWN=null;
function expertKoiEV(pts){
  const draws=G.aHand.length;
  const doubled=G.koiKoi||G.aKoiKoi;
  const stopNow=payout(pts,doubled);
  if(draws<=0){ LAST_KOI_BREAKDOWN={ownEV:0,oppEV:0,pOppBeats:0,stopNow}; return -99; }

  // Ожидаемый ИТОГ портфеля ИИ, если раунд доиграется до конца —
  // уже включает и то, что достигнуто, и вероятностную надбавку.
  const ownEV=Math.max(pts,basePortfolio().ai);
  // То же для игрока — единственный источник «угрозы» в этой модели.
  const oppEV=basePortfolio().opp;

  // Грубая оценка «кто победит по яку», если руки кончатся раньше стопа:
  // относительная сила портфелей. weightOpp — та самая калибровка:
  // при 0 угроза от противника нулевая, но не может расти быстрее нас.
  const weightOpp=0.55;
  const pOppBeats=oppEV<=0?0.03:Math.min(0.85,(oppEV*weightOpp)/(oppEV*weightOpp+ownEV+1));

  // Раунд заканчивается либо явным стопом (тогда действует ×2 за Мяу-Мяу),
  // либо исчерпанием рук — а там теперь БЕЗ множителя, только разница сумм
  // яку (см. endRound). pExhaust — грубая оценка, что до явного стопа дело
  // не дойдёт и раунд решится именно исчерпанием: чем позже фаза игры и
  // меньше ходов остаётся, тем выше шанс не успеть зафиксировать стоп.
  const pExhaust=Math.max(0.15,Math.min(0.75,gamePhase()));
  const winExplicit=payout(ownEV,true);
  const winExhaust=Math.max(0,ownEV-oppEV);
  const winContinue=(1-pExhaust)*winExplicit+pExhaust*winExhaust;
  const loseExplicit=-payout(oppEV,true);
  const loseExhaust=-Math.max(0,oppEV-ownEV);
  const loseContinue=(1-pExhaust)*loseExplicit+pExhaust*loseExhaust;
  const evKoi=(1-pOppBeats)*winContinue+pOppBeats*loseContinue;
  LAST_KOI_BREAKDOWN={ownEV:+ownEV.toFixed(2),oppEV:+oppEV.toFixed(2),pOppBeats:+pOppBeats.toFixed(2),stopNow:+stopNow.toFixed(2),evKoi:+evKoi.toFixed(2)};
  return evKoi-stopNow;
}
function aiShouldKoiKoi(pts){
  invalidateUnknownCache();
  if(DIFF===1){
    const d=pts<3&&Math.random()<0.65;
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,pts,decision:d?'koikoi':'stop'});
    return d;
  }
  const near=nearCompletionBonus();
  if(DIFF===2){
    const d=pts<3||(pts<5&&near>=4);
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,pts,near:+near.toFixed(2),decision:d?'koikoi':'stop'});
    return d;
  }
  const threat=playerThreatScore(),phase=gamePhase();
  if(DIFF===3){
    let d;
    if(threat>=18||phase>0.75) d=false;
    else d=pts<4||(pts<6&&near>=4.5);
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,pts,threat:+threat.toFixed(2),near:+near.toFixed(2),decision:d?'koikoi':'stop'});
    return d;
  }
  if(DIFF===4) return pimcShouldKoiKoi(pts);
  // Expert: решение по матожиданию с поправкой на положение в матче.
  // Матч теперь идёт до targetScore очков, а не фикс. числа раундов —
  // «конец матча» определяем как приближение чьего-либо счёта к цели.
  const ev=expertKoiEV(pts);
  const lead=G.scores[1]-G.scores[0];
  const nearMatchEnd=Math.max(G.scores[0],G.scores[1])>=G.targetScore*0.7;
  // Мягкий кап на число коикои подряд за раунд — не меняет сам EV-расчёт,
  // только поднимает планку для каждого следующего коикои в этом раунде.
  // Жертвуем немного EV ради предсказуемости для игрока (см. GAME-STATE.md
  // §5.1 — ужесточение общего порога уже проверялось и не давало эффекта
  // на win-rate; это другое — эскалация только внутри одного раунда).
  const koiCount=G.aKoiCount||0;
  const escalation=koiCount>=2?3:(koiCount>=1?1:0);
  let d;
  if(lead>10&&nearMatchEnd&&pts>=2) d=false;               // ведём под конец — фиксируем
  else if(lead<-10&&nearMatchEnd)   d=ev>-4+escalation;    // догоняем — рискуем шире, но тоже осторожнее с каждым разом
  else                                d=ev>escalation;
  logEvent('ai_koikoi_decision',Object.assign({round:G.round,diff:DIFF,pts,ev:+ev.toFixed(2),lead,nearMatchEnd,koiCount,escalation},LAST_KOI_BREAKDOWN,{decision:d?'koikoi':'stop'}));
  return d;
}

function aiTurnStart(){
  if(!G.aHand.length){endRound();return;}
  G.turn='ai';G.phase='wait';G.msg='Ход компьютера...';draw();setTimeout(aiPlay,650);
}
function aiPlay(){
  if(!G.aHand.length){endRound();return;}
  const move=aiChooseMove();if(!move){endRound();return;}
  const idx=move.handIndex,card=G.aHand[idx];
  const targets=G.table.filter(c=>move.captureIds.includes(c.id));
  G.aiHL=idx;G.aiCard=card;G.aiTargets=[];G.aiPreview=null;
  G.msg=`ИИ открывает карту: месяц ${card.m} (${card.t})`;draw();
  setTimeout(()=>{
    G.aiTargets=targets;
    G.msg=targets.length?`ИИ выбрал захват месяца ${card.m}`:`ИИ кладёт карту месяца ${card.m} на стол`;draw();
    setTimeout(()=>{
      G.aiHL=-1;G.aiCard=null;G.aiTargets=[];G.aHand.splice(idx,1);
      const captured=G.table.filter(c=>move.captureIds.includes(c.id));
      const n=applyCapture(card,G.aCap,move.captureIds);
      logEvent('ai_move',{round:G.round,card:cardDesc(card),captured:handDesc(captured),hand:handDesc(G.aHand)});
      G.msg=n?`ИИ захватил ${n} карты (месяц ${card.m})`:'ИИ кладёт карту на стол';draw();setTimeout(aiDraw,500);
    },430);
  },430);
}
function aiDraw(){
  if(!G.deck.length){finishAiTurn();return;}
  const card=G.deck[G.deck.length-1];
  G.aiPreview=card;G.aiTargets=G.table.filter(c=>c.m===card.m);
  G.msg=G.aiTargets.length?`Из колоды: месяц ${card.m} — совпадение!`:`Из колоды: месяц ${card.m} — на стол`;draw();
  setTimeout(()=>{
    G.aiPreview=null;G.aiTargets=[];G.deck.pop();
    const ids=aiChooseCaptureIds(card);
    const chosen=G.table.filter(c=>ids.includes(c.id));
    G.aiTargets=chosen;draw();
    setTimeout(()=>{
      G.aiTargets=[];
      const n=applyCapture(card,G.aCap,ids);
      logEvent('ai_draw',{round:G.round,card:cardDesc(card),captured:handDesc(chosen),hand:handDesc(G.aHand)});
      G.msg=n?`ИИ из колоды захватил ${n} карты`:'ИИ из колоды кладёт карту на стол';draw();
      setTimeout(finishAiTurn,350);
    },300);
  },600);
}
let KOIKOI_POPUP=null; // 'ai'|'player'|null — временный крупный попап поверх экрана
function showKoiKoiPopup(side,cb){
  KOIKOI_POPUP=side;draw();
  setTimeout(()=>{KOIKOI_POPUP=null;draw();if(cb)cb();},900);
}
function finishAiTurn(){
  const yaku=getYaku(G.aCap),pts=yakuPts(yaku),key=yakuKey(yaku);
  const improved=pts>0&&(pts>G.aPrevPts||key!==G.aPrevYakuKey);
  if(improved){
    G.aPrevPts=pts;G.aPrevYakuKey=key;
    if(!aiShouldKoiKoi(pts)){
      G.msg=`ИИ: яку ${pts}, СТОП!`;draw();setTimeout(()=>endRound('ai',scoredPoints(pts)),900);return;
    }
    G.aKoiKoi=true;G.aKoiCount=(G.aKoiCount||0)+1;G.msg=`🐱 ИИ говорит МЯУ-МЯУ! (${pts} оч.)`;
    showKoiKoiPopup('ai',passToPlayer);return;
  }
  if(!G.pHand.length&&!G.aHand.length){endRound();return;}
  passToPlayer();
}
function passToPlayer(){
  if(!G.pHand.length&&!G.aHand.length){endRound();return;}
  G.turn='player';G.phase='select';G.sel=null;G.msg='Ваш ход — выберите карту из руки';draw();
}

// ── Завершение раунда ────────────────────────────────────────────
function endRound(winner,pts){
  G.phase='roundover';
  let roundWinner=winner,roundPts=0,roundYaku=[];
  if(winner==='player'){
    const y=getYaku(G.pCap),base=yakuPts(y);
    const award=pts==null?scoredPoints(base):pts;
    G.scores[0]+=award;G.dealer='player';
    G.msg=`Раунд ${G.round}: вы выиграли! +${award} очков${scoreBreakdown(base)}`;
    roundPts=award;roundYaku=y.map(x=>x.n);
  }else if(winner==='ai'){
    const y=getYaku(G.aCap),base=yakuPts(y);
    const award=pts==null?scoredPoints(base):pts;
    G.scores[1]+=award;G.dealer='ai';
    G.msg=`Раунд ${G.round}: ИИ выиграл! +${award} очков${scoreBreakdown(base)}`;
    roundPts=award;roundYaku=y.map(x=>x.n);
  }else{
    // House rule Kittyfooda: при исчерпании рук — БЕЗ множителя за Мяу-Мяу.
    // Награда — разница между суммами яку, а не полная сумма победителя.
    // Так объявление Мяу-Мяу становится настоящим риском: если не успел
    // зафиксировать явным стопом, а колода кончилась — бонуса не будет.
    const pp=yakuPts(getYaku(G.pCap)),ap=yakuPts(getYaku(G.aCap));
    if(pp>ap){
      const award=pp-ap;G.scores[0]+=award;G.dealer='player';
      G.msg=`Раунд ${G.round}: по яку — вы! +${award} оч. (разница ${pp}−${ap})`;
      roundWinner='player';roundPts=award;roundYaku=getYaku(G.pCap).map(x=>x.n);
    }else if(ap>pp){
      const award=ap-pp;G.scores[1]+=award;G.dealer='ai';
      G.msg=`Раунд ${G.round}: по яку — ИИ! +${award} оч. (разница ${ap}−${pp})`;
      roundWinner='ai';roundPts=award;roundYaku=getYaku(G.aCap).map(x=>x.n);
    }else{
      // При равенстве dealer сохраняется.
      G.msg=`Раунд ${G.round}: ничья`;
      roundWinner='draw';
    }
  }
  logEvent('round_end',{round:G.round,winner:roundWinner,pts:roundPts,yaku:roundYaku,scores:[...G.scores]});
  if(G.scores[0]>=G.targetScore||G.scores[1]>=G.targetScore){
    G.phase='gameover';
    const result=G.scores[0]>G.scores[1]?'win':(G.scores[0]<G.scores[1]?'lose':'draw');
    saveMatchResult(result,G.scores[0],G.scores[1]);
    logEvent('game_end',{result,scores:[...G.scores],diff:DIFF});
  }
  draw();
}

// ── Небольшие sanity-checks правил; можно удалить после стабилизации ──
function runRuleSanityChecks(){
  const d=buildDeck();
  const by=(m,t)=>d.find(c=>c.m===m&&(!t||c.t===t));
  const c1=by(1,'bright'),m1=d.filter(c=>c.m===1&&c.id!==c1.id);
  console.assert(captureOptions(c1,[]).length===1&&captureOptions(c1,[])[0].length===0,'capture 0');
  console.assert(captureOptions(c1,[m1[0]]).length===1&&captureOptions(c1,[m1[0]])[0].length===1,'capture 1');
  console.assert(captureOptions(c1,[m1[0],m1[1]]).length===2,'capture 2 choice');
  console.assert(captureOptions(c1,[m1[0],m1[1],m1[2]])[0].length===3,'capture 3 all');
  console.assert(getYaku([d.find(c=>c.sub==='sake'),...d.filter(c=>c.t==='plain').slice(0,9)]).some(y=>y.n.startsWith('Касу')),'sake counts as chaff');
  return true;
}

// ── Рисование ────────────────────────────────────────────────────
function draw(){
  ct.setTransform(1,0,0,1,0,0);
  ct.fillStyle='#0a0603';ct.fillRect(0,0,cv.width,cv.height);
  if(G.phase==='start'||G.phase==='gameover'){setLegacyTransform();drawOverlay();return;}
  if(G.phase==='log'){setLegacyTransform();drawEventLogScreen();return;}
  setBoardTransform();
  drawBoard();
  setLegacyTransform();
  if(G.phase==='roundover') drawRoundOver();
  if(KOIKOI_POPUP) drawKoiKoiPopup();
  persistState();
}
function drawKoiKoiPopup(){
  const isAi=KOIKOI_POPUP==='ai';
  const col=isAi?'#c04040':'#70e870';
  const who=isAi?'ИИ':'ВЫ';
  ct.save();
  dimScreen('rgba(4,2,1,.55)');
  const cy=H*0.42,cw=300,ch=104;
  ct.shadowColor=col;ct.shadowBlur=28;
  ct.fillStyle='rgba(10,6,3,.92)';
  ct.beginPath();rr((W-cw)/2,cy-ch/2,cw,ch,16);ct.fill();
  ct.shadowBlur=0;
  ct.strokeStyle=col;ct.lineWidth=2.5;
  ct.beginPath();rr((W-cw)/2,cy-ch/2,cw,ch,16);ct.stroke();
  ct.textAlign='center';ct.textBaseline='middle';
  ct.fillStyle=col;ct.font='bold 15px Georgia';
  ct.fillText(`${who} ГОВОРИТ`,W/2,cy-24);
  ct.font='bold 34px Georgia';
  ct.fillText('🐱 МЯУ-МЯУ!',W/2,cy+12);
  ct.restore();
}
