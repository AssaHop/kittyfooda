// ── Сохранение прогресса через бэкенд (Vercel + Supabase) ────────
const API_BASE = 'https://kittyfooda.vercel.app';
let TG_USER = null;
let TG_INIT_DATA = '';
let SESSION_EXPIRED = false;
if(window.Telegram && window.Telegram.WebApp){
  TG_INIT_DATA = window.Telegram.WebApp.initData || '';
  TG_USER = (window.Telegram.WebApp.initDataUnsafe || {}).user || null;
}

// Единая точка запросов к бэкенду: подпись Telegram уходит в заголовке,
// работает и для GET, и для POST. telegram_id сервер берёт из подписи.
async function apiFetch(path, options = {}){
  const headers = Object.assign(
    {'Content-Type':'application/json'},
    options.headers || {},
    TG_INIT_DATA ? {'X-Telegram-Init-Data': TG_INIT_DATA} : {}
  );
  const r = await fetch(`${API_BASE}${path}`, Object.assign({}, options, {headers}));
  if(r.status === 401){
    SESSION_EXPIRED = true;
    G.msg = 'Сессия устарела — переоткройте игру';
    draw();
  }
  return r;
}

let PLAYER_STATS={wins:0,losses:0,draws:0}; // накопительная статистика, подгружается из базы

async function syncUser(){
  if(!TG_USER) return null; // не в Telegram — работаем без сохранения
  try{
    // 1) регистрируем/обновляем юзернейм
    await apiFetch('/api/save-progress', { method:'POST', body: JSON.stringify({}) });
    // 2) подгружаем накопленную статистику и сохранённую партию
    const r = await apiFetch('/api/save-progress');
    const data = await r.json();
    if(data.user){
      PLAYER_STATS.wins=data.user.wins||0;
      PLAYER_STATS.losses=data.user.losses||0;
      PLAYER_STATS.draws=data.user.draws||0;
      if(data.user.game_state){
        SAVED_GAME=data.user.game_state;
      }
      hintsOwnedSync();
    }
    SYNC_DONE=true;
    draw();
    return data.user || null;
  }catch(e){ console.warn('syncUser failed', e); SYNC_DONE=true; return null; }
}

async function saveMatchResult(result, playerScore, aiScore){
  if(!TG_USER||SESSION_EXPIRED) return;
  try{
    if(result==='win') PLAYER_STATS.wins++;
    else if(result==='lose') PLAYER_STATS.losses++;
    else PLAYER_STATS.draws++;
    draw();
    await apiFetch('/api/save-progress', {
      method:'POST',
      body: JSON.stringify({ result })
    });
  }catch(e){ console.warn('saveMatchResult failed', e); }
}
function hintsOwnedSync(){} // заглушка на будущее (синхронизация купленных бустеров)

// Регистрируем/обновляем пользователя сразу при открытии игры
syncUser();

// ── Покупка подсказки через Telegram Stars ────────────────────────
const HINT_PRICE = 15; // звёзд за одну подсказку
let hintsOwned = 0;
let hintActive = null; // индекс подсвеченной карты-подсказки

async function buyHint(){
  if(!TG_USER){ G.msg='Подсказки доступны только в Telegram'; draw(); return; }
  try{
    const r = await apiFetch('/api/create-invoice', {
      method:'POST',
      body: JSON.stringify({ item:'hint' })
    });
    const data = await r.json();
    if(!data.invoice_link){ G.msg='Не удалось создать счёт'; draw(); return; }
    window.Telegram.WebApp.openInvoice(data.invoice_link, (status)=>{
      if(status==='paid'){
        hintsOwned++;
        G.msg='Подсказка куплена! Нажмите 💡 ещё раз, чтобы применить.';
        draw();
      }
    });
  }catch(e){ console.warn('buyHint failed', e); }
}

function useHint(){
  if(hintsOwned<=0){ buyHint(); return; }
  if(G.phase!=='select'||G.turn!=='player'||!G.pHand.length) return;
  // Простая эвристика: подсвечиваем карту с лучшим immediate-захватом, иначе с наибольшей ценностью
  let bestI=0,bestScore=-Infinity;
  G.pHand.forEach((card,i)=>{
    const matches=G.table.filter(t=>t.m===card.m);
    let s=cardVal(card,G.pCap);
    if(matches.length) s+=50+matches.reduce((a,m)=>a+typeVal(m),0);
    if(s>bestScore){bestScore=s;bestI=i;}
  });
  hintsOwned--;
  hintActive=bestI;
  G.msg=`💡 Подсказка: карта №${bestI+1} слева`;
  draw();
  setTimeout(()=>{hintActive=null;draw();},3000);
}

// ── Колода 48 карт ───────────────────────────────────────────────
function buildDeck(){
  const d=[
    {m:1,t:'bright',sub:'crane'},{m:1,t:'ribbon',sub:'poetry'},{m:1,t:'plain'},{m:1,t:'plain'},
    {m:2,t:'animal'},{m:2,t:'ribbon',sub:'poetry'},{m:2,t:'plain'},{m:2,t:'plain'},
    {m:3,t:'bright',sub:'curtain'},{m:3,t:'ribbon',sub:'poetry'},{m:3,t:'plain'},{m:3,t:'plain'},
    {m:4,t:'animal'},{m:4,t:'ribbon'},{m:4,t:'plain'},{m:4,t:'plain'},
    {m:5,t:'animal'},{m:5,t:'ribbon'},{m:5,t:'plain'},{m:5,t:'plain'},
    {m:6,t:'animal',sub:'butterfly'},{m:6,t:'ribbon',sub:'blue'},{m:6,t:'plain'},{m:6,t:'plain'},
    {m:7,t:'animal',sub:'boar'},{m:7,t:'ribbon'},{m:7,t:'plain'},{m:7,t:'plain'},
    {m:8,t:'bright',sub:'moon'},{m:8,t:'animal'},{m:8,t:'plain'},{m:8,t:'plain'},
    {m:9,t:'animal',sub:'sake'},{m:9,t:'ribbon',sub:'blue'},{m:9,t:'plain'},{m:9,t:'plain'},
    {m:10,t:'animal',sub:'deer'},{m:10,t:'ribbon',sub:'blue'},{m:10,t:'plain'},{m:10,t:'plain'},
    {m:11,t:'bright',sub:'rain'},{m:11,t:'animal'},{m:11,t:'ribbon'},{m:11,t:'plain'},
    {m:12,t:'bright'},{m:12,t:'plain'},{m:12,t:'plain'},{m:12,t:'plain'},
  ];
  d.forEach((c,i)=>c.id=i);
  // Проставляем стабильный номер картинки для plain-карт (1,2,3 в рамках месяца)
  const plainCount={};
  d.forEach(c=>{
    if(c.t==='plain'){
      plainCount[c.m]=(plainCount[c.m]||0)+1;
      c.plainIdx=plainCount[c.m];
    }
  });
  return d;
}
let DIFF=3; // 1 Easy, 2 Normal, 3 Hard, 4 Expert

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}}

// ── Яку ──────────────────────────────────────────────────────────
// Сохраняем выбранные в Kittyfooda стоимости. Чаша саке считается и Animal,
// и Chaff для Kasu — распространённое современное правило Koi-Koi.
function getYaku(cap){
  const B=cap.filter(c=>c.t==='bright');
  const A=cap.filter(c=>c.t==='animal');
  const R=cap.filter(c=>c.t==='ribbon');
  // Канон: саке — животное (Тане, Ханами, Цукими), в Касу НЕ входит.
  const chaffCount=cap.filter(c=>c.t==='plain').length;
  const y=[];
  const hasRain=B.some(c=>c.sub==='rain');
  if(B.length>=5)                    y.push({n:'Гоко',      p:10});
  else if(B.length===4&&!hasRain)    y.push({n:'Сико',       p:8});
  else if(B.length===4&&hasRain)     y.push({n:'Амэ-Сико',  p:7});
  else if(B.length===3&&!hasRain)    y.push({n:'Санко',      p:5});
  if(A.some(c=>c.sub==='boar')&&A.some(c=>c.sub==='deer')&&A.some(c=>c.sub==='butterfly'))
    y.push({n:'Ино-Сика-Тё',p:5});
  const hasCur=B.some(c=>c.sub==='curtain'),hasMoon=B.some(c=>c.sub==='moon');
  const hasSake=A.some(c=>c.sub==='sake');
  if(hasCur&&hasSake)  y.push({n:'Ханами',  p:3});
  if(hasMoon&&hasSake) y.push({n:'Цукими',  p:3});
  const poetry=R.filter(c=>c.sub==='poetry').length;
  const blue  =R.filter(c=>c.sub==='blue').length;
  if(poetry>=3) y.push({n:'Ака-тан', p:5});
  if(blue>=3)   y.push({n:'Ао-тан',  p:5});
  if(R.length>=5) y.push({n:`Тан×${R.length}`,  p:R.length-4});
  if(A.length>=5) y.push({n:`Тане×${A.length}`, p:A.length-4});
  if(chaffCount>=10)y.push({n:`Касу×${chaffCount}`, p:chaffCount-9});
  return y;
}
function yakuPts(y){return y.reduce((s,x)=>s+x.p,0);}
function yakuKey(y){return y.map(x=>`${x.n}:${x.p}`).sort().join('|');}

// Канон: удвоение только за Мяу-Мяу. 7+ ×2 было отсебятиной, убрано.
function scoredPoints(base){

function scoreBreakdown(base){
  const parts=[];
  if(G.koiKoi||G.aKoiKoi) parts.push('Мяу-Мяу ×2');
  return parts.length?` (${base}; ${parts.join(', ')})`:'';
}

// ═══════════════════════════════════════════════════════════════
// ЖУРНАЛ СОБЫТИЙ — плоский JSON, без отрисовки в игре.
// Формат по образцу другого проекта: {version, exportedAt, events:[...]}.
// Каждое решение ИИ пишется со ВСЕМИ рассмотренными вариантами и их
// оценками, не только выбранным — этого не видно на экране ни при
// каком UI, только через экспорт. Хранится в localStorage ЭТОГО
// браузера/устройства, растёт, пока не нажмёшь «Очистить».
// ═══════════════════════════════════════════════════════════════
const EVENT_LOG_KEY='kittyfooda_event_log';
const EVENT_LOG_VERSION='kittyfooda-hanafuda-1';
const EVENT_LOG_MAX=4000; // строки лога — при превышении обрезаются старые

function loadEventLog(){
  try{
    const raw=localStorage.getItem(EVENT_LOG_KEY);
    if(!raw) return [];
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed.events)?parsed.events:[];
  }catch(e){ console.warn('loadEventLog failed',e); return []; }
}
function saveEventLog(events){
  try{
    const trimmed=events.length>EVENT_LOG_MAX?events.slice(events.length-EVENT_LOG_MAX):events;
    localStorage.setItem(EVENT_LOG_KEY, JSON.stringify({version:EVENT_LOG_VERSION,events:trimmed}));
  }catch(e){ console.warn('saveEventLog failed — возможно, localStorage переполнен или недоступен',e); }
}
function logEvent(type,payload){
  const events=loadEventLog();
  events.push(Object.assign({ts:Date.now(),type},payload));
  saveEventLog(events);
}
function eventLogCount(){ return loadEventLog().length; }
function clearEventLog(){ try{ localStorage.removeItem(EVENT_LOG_KEY); }catch(e){} }

// Компактное описание карты для лога — тип/месяц/подтип, без внутренних id
function cardDesc(c){ return c?{t:c.t,m:c.m,sub:c.sub||null}:null; }
function handDesc(hand){ return hand.map(cardDesc); }

function downloadEventLog(){
  const events=loadEventLog();
  const blob=new Blob([JSON.stringify({version:EVENT_LOG_VERSION,exportedAt:new Date().toISOString(),events},null,0)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`kittyfooda_log_${Date.now()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
// Резервный способ на случай, если скачивание файла заблокировано
// внутри Telegram WebView — тогда просто копируем JSON в буфер обмена.
function copyEventLogToClipboard(onDone){
  const events=loadEventLog();
  const text=JSON.stringify({version:EVENT_LOG_VERSION,exportedAt:new Date().toISOString(),events});
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      document.execCommand('copy');document.body.removeChild(ta);
      onDone();
    }catch(e){ console.warn('copy failed',e); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(fallback);
  }else fallback();
}

function monthCounts(cards){
  const c={};
  cards.forEach(x=>c[x.m]=(c[x.m]||0)+1);
  return c;
}
function hasTeshi(cards){return Object.values(monthCounts(cards)).some(n=>n===4);}
function hasKuttsuki(cards){return Object.values(monthCounts(cards)).filter(n=>n===2).length===4;}
function validDeal(deck){
  const p=deck.slice(0,8), a=deck.slice(8,16), t=deck.slice(16,24);
  // Скрыто отбрасываем автоматические/бессодержательные стартовые исходы.
  if(hasTeshi(p)||hasKuttsuki(p)||hasTeshi(a)||hasKuttsuki(a)) return false;
  if(hasTeshi(t)||hasKuttsuki(t)) return false;
  return true;
}

function newRound(){
  let deck;
  do{deck=buildDeck();shuffle(deck);}while(!validDeal(deck));
  const dealer=G.dealer||'player';
  G={...G,phase:'wait',turn:dealer,sel:null,aiCard:null,
    deck:deck.slice(24),pHand:deck.slice(0,8),aHand:deck.slice(8,16),table:deck.slice(16,24),
    pCap:[],aCap:[],prevPts:0,aPrevPts:0,prevYakuKey:'',aPrevYakuKey:'',
    koiKoi:false,aKoiKoi:false,currentYaku:[],
    aiHL:-1,aiTargets:[],aiPreview:null,pendingCapture:null,
    msg:dealer==='player'?'Ваш ход — выберите карту из руки':'Дилер ИИ ходит первым...'};
  if(dealer==='player') G.phase='select';
  logEvent('round_start',{round:G.round,diff:DIFF,dealer,
    playerHand:handDesc(G.pHand),aiHand:handDesc(G.aHand),table:handDesc(G.table)});
  draw();persistState();
  if(dealer==='ai') setTimeout(aiTurnStart,650);
}

// ── Правила захвата ──────────────────────────────────────────────
function captureOptions(card,table=G.table){
  const m=table.filter(c=>c.m===card.m);
  if(m.length===0) return [[]];
  if(m.length===1) return [[m[0].id]];
  if(m.length===2) return [[m[0].id],[m[1].id]];
  return [m.map(c=>c.id)]; // при трёх совпадениях забираются все три
}
function applyCapture(card,pile,captureIds){
  if(!captureIds||!captureIds.length){G.table.push(card);return 0;}
  const ids=new Set(captureIds);
  const taken=G.table.filter(c=>ids.has(c.id));
  G.table=G.table.filter(c=>!ids.has(c.id));
  pile.push(card,...taken);
  return taken.length+1;
}
function captureLabel(n,card){return n?`Захват: ${n} карты месяца ${card.m}`:'Карта на стол';}

function beginPlayerCaptureChoice(card,kind,handIndex,options){
  const ids=options.flat();
  G.pendingCapture={owner:'player',kind,card,handIndex,options};
  G.aiTargets=G.table.filter(c=>ids.includes(c.id));
  G.phase='captureSelect';
  G.msg='Две карты этого месяца на столе — выберите одну для захвата';
  draw();
}
function playerResolveCapture(targetId){
  const p=G.pendingCapture;
  if(!p||p.owner!=='player') return;
  const option=p.options.find(o=>o.includes(targetId));
  if(!option) return;
  if(p.kind==='hand') G.pHand.splice(p.handIndex,1);
  const n=applyCapture(p.card,G.pCap,option);
  G.pendingCapture=null;G.aiTargets=[];G.msg=captureLabel(n,p.card);G.phase='wait';draw();
  if(p.kind==='hand') setTimeout(playerDraw,500);
  else setTimeout(finishPlayerTurn,350);
}

function playerPlay(idx){
  if(G.phase!=='select'||G.turn!=='player')return;
  const card=G.pHand[idx];G.sel=null;
  const opts=captureOptions(card);
  if(opts.length===2){beginPlayerCaptureChoice(card,'hand',idx,opts);return;}
  G.pHand.splice(idx,1);
  const n=applyCapture(card,G.pCap,opts[0]);
  G.msg=captureLabel(n,card);G.phase='wait';draw();setTimeout(playerDraw,500);
}
function playerDraw(){
  if(!G.deck.length){finishPlayerTurn();return;}
  const card=G.deck[G.deck.length-1];
  G.aiPreview=card;G.aiTargets=G.table.filter(c=>c.m===card.m);
  G.msg=`Из колоды: месяц ${card.m}${G.aiTargets.length?' — совпадение!':' — на стол'}`;draw();
  setTimeout(()=>{
    G.aiPreview=null;G.aiTargets=[];G.deck.pop();
    const opts=captureOptions(card);
    if(opts.length===2){beginPlayerCaptureChoice(card,'draw',-1,opts);return;}
    const n=applyCapture(card,G.pCap,opts[0]);
    G.msg=n?`Из колоды: захват ${n} карты месяца ${card.m}`:'Из колоды: карта на стол';draw();
    setTimeout(finishPlayerTurn,350);
  },650);
}
function finishPlayerTurn(){
  const yaku=getYaku(G.pCap),pts=yakuPts(yaku),key=yakuKey(yaku);
  const improved=pts>0&&(pts>G.prevPts||key!==G.prevYakuKey);
  if(improved){
    G.prevPts=pts;G.prevYakuKey=key;G.currentYaku=yaku;G.phase='choose';
    G.msg=`Яку! ${yaku.map(y=>y.n).join(' + ')} = ${pts}. Стоп или Мяу-Мяу?`;draw();return;
  }
  if(!G.pHand.length&&!G.aHand.length){endRound();return;}
  aiTurnStart();
}
function playerChoose(stop){
  if(stop){
    const base=yakuPts(G.currentYaku||getYaku(G.pCap));
    endRound('player',scoredPoints(base));
  }else{
    G.koiKoi=true;G.phase='wait';G.msg='Мяу-Мяу! Продолжаем...';
    showKoiKoiPopup('player',aiTurnStart);
  }
}

// ── Оценка карт и угроз ──────────────────────────────────────────
// Грубая метрика редкости типа карты — используется только в подсказке
// игроку (useHint), к оценкам ИИ отношения не имеет.
function typeVal(c){return{bright:20,animal:10,ribbon:5,plain:1}[c.t]||0;}

// ═══════════════════════════════════════════════════════════════
// ПОРТФЕЛЬ ЯКУ — единая модель ценности карты для обеих сторон.
//
// Идея: вместо ручных чисел вида «+10 за вторую ленту» считаем для
// каждого фиксированного яку три вещи — сколько элементов уже есть,
// какие конкретно карты недостают, и какова вероятность их достать.
// Ценность карты = насколько она меняет эту сумму. Отсюда бесплатно
// получаются оба нужных свойства: яку, для которого недостающая
// карта уже лежит у противника, обнуляется сам (карта локализована —
// вероятность 0), а карта на пересечении нескольких почти готовых
// яку (как саке при занавесе+луне у игрока) получает их сумму.
//
// Не точная теория вероятностей (независимость карт друг от друга —
// упрощение), а инженерная оценка. Три места калибровки помечены
// ниже; крутятся через headless-прогон, не на глаз.
// ═══════════════════════════════════════════════════════════════
const REF_DECK=buildDeck();
const poolIds=pred=>REF_DECK.filter(pred).map(c=>c.id);
const POOL_BRIGHT =poolIds(c=>c.t==='bright');                       // 5
const POOL_RAIN_ID=poolIds(c=>c.sub==='rain')[0];
const POOL_INO    =poolIds(c=>['boar','deer','butterfly'].includes(c.sub)); // 3
const POOL_AKATAN =poolIds(c=>c.sub==='poetry');                     // 3
const POOL_AOTAN  =poolIds(c=>c.sub==='blue');                       // 3
const POOL_HANAMI =poolIds(c=>c.sub==='curtain'||c.sub==='sake');    // 2
const POOL_TSUKIMI=poolIds(c=>c.sub==='moon'||c.sub==='sake');       // 2
const POOL_RIBBON =poolIds(c=>c.t==='ribbon');                       // 10 (Тан)
const POOL_ANIMAL =poolIds(c=>c.t==='animal');                       // 9  (Тане)
const POOL_PLAIN  =poolIds(c=>c.t==='plain');                        // 24 (Касу, без саке — канон)

// locateCardId зовётся десятки раз на одну оценку хода (по каждой
// недостающей карте каждого пула); кешируем реальное расположение в Map
// на время одной оценки — реальные зоны G не меняются, пока считается
// гипотетический ход, меняется только локальный «cap» в cardVal/blockingValueFor.
let _locMap=null;
function buildLocMap(){
  const m=new Map();
  G.aCap.forEach(c=>m.set(c.id,'ai'));
  G.pCap.forEach(c=>m.set(c.id,'opp'));
  G.aHand.forEach(c=>{if(!m.has(c.id))m.set(c.id,'aiHand');});
  G.table.forEach(c=>{if(!m.has(c.id))m.set(c.id,'table');});
  return m;
}
function locateCardId(id){
  if(!_locMap)_locMap=buildLocMap();
  return _locMap.get(id)||'unknown'; // не в известных зонах — в колоде или руке игрока
}
// Вероятность, что карту id в итоге заберёт сторона side ('ai'|'opp').
// Ключевое: если карта уже в стопке противоположной стороны — 0.
// Калибровка №1: константы для руки/стола/неизвестной массы.
function cardProb(id,side){
  const loc=locateCardId(id);
  if(loc==='ai') return side==='ai'?1:0;
  if(loc==='opp')return side==='opp'?1:0;
  if(loc==='aiHand') return side==='ai'?0.8:0.05;   // только владелец решает, когда сыграть
  if(loc==='table'){
    const myTurn=(G.turn==='ai')===(side==='ai');
    return myTurn?0.58:0.42;                        // чуть выгоднее тому, чей сейчас ход
  }
  // Неизвестная масса: колода + рука соперника. Чем меньше своих
  // оставшихся ходов относительно размера этой массы — тем ниже шанс
  // встретить именно эту карту. Даёт естественное затухание к концу раздачи.
  const U=Math.max(1,unknownCount());
  const chances=side==='ai'?G.aHand.length:G.pHand.length;
  return Math.min(0.5,chances/U);
}
// Линейная интерполяция по контрольным точкам — для плавных порогов
// вместо резких скачков на границах Санко/Сико/Гоко.
function lerpTable(x,pts){
  for(let i=0;i<pts.length-1;i++){
    const[x0,y0]=pts[i],[x1,y1]=pts[i+1];
    if(x<=x1) return y0+(y1-y0)*Math.max(0,(x-x0)/(x1-x0));
  }
  return pts[pts.length-1][1];
}
function fixedSetValue(pool,pts,cap,side){
  const owned=pool.filter(id=>cap.some(c=>c.id===id));
  if(owned.length===pool.length) return pts; // уже собрано — точно, не вероятностно
  let p=1;
  for(const id of pool) if(!owned.includes(id)) p*=cardProb(id,side);
  return pts*p;
}
function brightValue(cap,side){
  const owned=POOL_BRIGHT.filter(id=>cap.some(c=>c.id===id));
  let E=owned.length;
  for(const id of POOL_BRIGHT) if(!owned.includes(id)) E+=cardProb(id,side);
  // Санко 5 / Сико 8 / Амэ-Сико 7 — усредняем 4-й порог, т.к. не знаем
  // заранее, войдёт ли в набор именно дождь.
  return lerpTable(E,[[0,0],[3,5],[4,7.5],[5,10]]);
}
function progressiveValue(pool,cap,side){
  const owned=pool.filter(id=>cap.some(c=>c.id===id)).length;
  let E=owned;
  for(const id of pool) if(!cap.some(c=>c.id===id)) E+=cardProb(id,side);
  return Math.max(0,E-4); // по 1 очку за каждую сверх четырёх — как в getYaku
}
// Полная ожидаемая стоимость портфеля одной стороны в очках яку.
function portfolioValue(cap,side){
  return fixedSetValue(POOL_INO,5,cap,side)
       + fixedSetValue(POOL_AKATAN,5,cap,side)
       + fixedSetValue(POOL_AOTAN,5,cap,side)
       + fixedSetValue(POOL_HANAMI,3,cap,side)
       + fixedSetValue(POOL_TSUKIMI,3,cap,side)
       + brightValue(cap,side)
       + progressiveValue(POOL_RIBBON,cap,side)
       + progressiveValue(POOL_ANIMAL,cap,side)
       + progressiveValue(POOL_PLAIN,cap,side);
}
// Ценность карты для собственного портфеля ИИ — насколько её взятие
// поднимает ожидаемую сумму очков.
function cardVal(card,captured){
  // Базовое значение для ТЕКУЩИХ G.aCap кешируется; если captured — это
  // гипотетическая (не текущая) стопка, считаем честно без кеша.
  const base=(captured===G.aCap)?basePortfolio().ai:portfolioValue(captured,'ai');
  return portfolioValue([...captured,card],'ai')-base;
}
// Ценность карты как БЛОКИРОВКИ — тот же расчёт, но с точки зрения
// портфеля игрока: сколько он теряет, если карта достанется не ему.
// Это то место, где саке при занавесе+луне у игрока получает высокую
// оценку сама по себе — как сумма двух почти готовых яку.
function blockingValueFor(card,cap){
  const base=(cap===G.pCap)?basePortfolio().opp:portfolioValue(cap,'opp');
  return portfolioValue([...cap,card],'opp')-base;
}
// Общая ожидаемая ценность портфеля игрока — используется в решении
// Мяу-Мяу/Стоп как мера того, есть ли у него вообще что терять.
function playerThreatScore(){ return basePortfolio().opp; }
function gamePhase(){return Math.max(0,Math.min(1,(24-G.deck.length)/16));}

function legalMovesForHand(hand,table=G.table){
  const out=[];
  hand.forEach((card,handIndex)=>captureOptions(card,table).forEach(captureIds=>out.push({handIndex,card,captureIds})));
  return out;
}
function captureCardsFor(action,table=G.table){
  const ids=new Set(action.captureIds||[]);return table.filter(c=>ids.has(c.id));
}
function simulateTableAfter(action,table=G.table){
  const ids=new Set(action.captureIds||[]);
  const t=table.filter(c=>!ids.has(c.id));
  if(!action.captureIds.length)t.push(action.card);
  return t;
}
// Единый расчёт: разница ожидаемых очков портфеля ДО и ПОСЛЕ хода —
// одним атомарным diff на карту+все взятые сразу (не по одной!), иначе
// комбинация из двух карт, которая ЗАВЕРШАЕТ яку только вместе
// (например, обе последние поэтические ленты разом), недосчиталась бы.
// SCALE=1: раньше здесь стоял отдельный «×22» поверх сырого прироста
// getYaku — то была вторая, несогласованная шкала очков сверху cardVal.
// Портфель уже сам в единицах ожидаемых очков, второй множитель не нужен.
function immediateGain(action,cap,table=G.table){
  const taken=captureCardsFor(action,table);
  if(!taken.length) return -cardVal(action.card,cap)*0.18;
  const before=(cap===G.aCap)?basePortfolio().ai:portfolioValue(cap,'ai');
  const after=portfolioValue([...cap,action.card,...taken],'ai');
  return (after-before)+taken.length*0.5; // +0.5/карту — темп, не яку-ценность
}
function defensiveGain(action){
  const taken=captureCardsFor(action);
  if(taken.length) return taken.reduce((s,c)=>s+blockingValueFor(c,G.pCap),0);
  // Карту без захвата мы выставляем на стол и потенциально отдаём игроку.
  return -blockingValueFor(action.card,G.pCap)*0.8;
}
function normalActionScore(a){return immediateGain(a,G.aCap);}
function hardActionScore(a){
  let s=immediateGain(a,G.aCap)+defensiveGain(a)*0.9;
  const phase=gamePhase();
  if(G.koiKoi) s+=defensiveGain(a)*0.45;
  if(phase>0.65) s+=defensiveGain(a)*0.35;
  return s;
}

function publicUnknownCards(){
  const knownIds=new Set([...G.aHand,...G.table,...G.aCap,...G.pCap].map(c=>c.id));
  return REF_DECK.filter(c=>!knownIds.has(c.id)); // REF_DECK — общий эталон, не пересоздаём колоду
}
// Портфель зовёт publicUnknownCards().length на каждую недостающую карту
// каждого пула при оценке каждого хода — кешируем на время одной оценки,
// сбрасывается перед каждым вызовом aiChooseMove/expertSimulationScore.
let _unknownCountCache=null;
function unknownCount(){
  if(_unknownCountCache==null){
    const knownIds=new Set([...G.aHand,...G.table,...G.aCap,...G.pCap].map(c=>c.id));
    _unknownCountCache=REF_DECK.reduce((n,c)=>n+(knownIds.has(c.id)?0:1),0);
  }
  return _unknownCountCache;
}
// portfolioValue(G.aCap/'ai') и (G.pCap/'opp') в исходном виде запрашиваются
// заново на каждого кандидата хода и на каждый сэмпл симуляции, хотя сами
// стопки не меняются в пределах одной оценки — кешируем базовые значения.
let _basePortfolio=null;
function basePortfolio(){
  if(!_basePortfolio) _basePortfolio={ai:portfolioValue(G.aCap,'ai'),opp:portfolioValue(G.pCap,'opp')};
  return _basePortfolio;
}
function invalidateUnknownCache(){ _unknownCountCache=null; _locMap=null; _basePortfolio=null; }
function bestCaptureOptionForCard(card,table,cap,defCap=null){
  const opts=captureOptions(card,table);
  let best=opts[0],bs=-Infinity;
  const before=(cap===G.aCap)?basePortfolio().ai:portfolioValue(cap,'ai');
  for(const ids of opts){
    const taken=table.filter(c=>ids.includes(c.id));
    let s;
    if(!ids.length) s=-cardVal(card,cap)*0.12;
    else{
      const after=portfolioValue([...cap,card,...taken],'ai');
      s=(after-before)+taken.length*0.5;
      if(defCap) s+=taken.reduce((x,c)=>x+blockingValueFor(c,defCap),0)*0.7;
    }
    if(s>bs){bs=s;best=ids;}
  }
  return {ids:best,score:bs};
}
// ── Expert: какие месяцы ещё «живы» ──────────────────────────────
// ИИ видит стол, обе стопки захвата и свою руку. Если все 4 карты месяца
// уже там, карта этого месяца в руке никогда не захватит — это балласт.
function seenMonthCounts(){
  const cnt={};
  const add=c=>cnt[c.m]=(cnt[c.m]||0)+1;
  G.table.forEach(add);G.aCap.forEach(add);G.pCap.forEach(add);G.aHand.forEach(add);
  return cnt;
}
function isDeadCard(card,counts,table){
  return (4-(counts[card.m]||0))<=0 && !table.some(t=>t.m===card.m);
}
// Учёт собственной руки: чем сбрасываем и что после этого остаётся.
function handSynergy(action){
  if(action.handIndex==null) return 0;
  const counts=seenMonthCounts();
  const rest=G.aHand.filter((_,i)=>i!==action.handIndex);
  let v=0;
  if(!action.captureIds.length){
    const unseen=4-(counts[action.card.m]||0);
    const pairOnTable=G.table.some(t=>t.m===action.card.m);
    if(unseen<=0&&!pairOnTable) v+=8.5;                      // сбросили труп — отлично
    else{
      v-=unseen*1.6;                                         // живую карту отдавать жалко
      if(rest.some(c=>c.m===action.card.m)) v-=3.6;          // рвём свою пару
    }
  }
  for(const c of rest) if(isDeadCard(c,counts,G.table)) v-=3.2;
  return v;
}
// Базовая оценка Expert. Отдельно от hardActionScore, чтобы веса
// защиты не учитывались дважды при сложении с симуляцией.
// Expert взвешивает защиту сильнее Hard (1.5 против 0.9), и вдобавок
// получает НЕЛИНЕЙНУЮ надбавку за особо крупные блокировки: чем ближе
// чужой яку к завершению, тем выше сам defensiveGain (это не отдельная
// метрика «близости» — она уже зашита в портфельный diff, как в тесте
// с саке при занавесе+луне у игрока), а выпуклый бонус усиливает именно
// такие случаи ещё сильнее сверх линейного веса.
function expertBaseScore(a){
  const phase=gamePhase();
  const def=defensiveGain(a);
  let s=immediateGain(a,G.aCap)+def*1.5+Math.max(0,def-2)*1.3;
  if(G.koiKoi) s+=def*0.6;
  if(phase>0.65) s+=def*0.35;
  return s+handSynergy(a);
}
// Противник держит целую руку и играет ЛУЧШЕЙ картой, а не случайной.
// Берём максимум по нескольким пробам — иначе угроза занижается в разы.
function opponentBestResponse(table,oppCap,myCap,unknown,k){
  let best=-Infinity;
  const n=Math.max(1,Math.min(k,unknown.length));
  for(let i=0;i<n;i++){
    const c=unknown[(Math.random()*unknown.length)|0];
    const s=bestCaptureOptionForCard(c,table,oppCap,myCap).score;
    if(s>best)best=s;
  }
  return Math.max(0,best);
}
function expertSimulationScore(action){
  const unknown=publicUnknownCards();
  if(!unknown.length) return expertBaseScore(action);
  const baseTable=simulateTableAfter(action);
  const baseCap=[...G.aCap];
  const taken=captureCardsFor(action);
  if(taken.length)baseCap.push(action.card,...taken);

  // Эндшпиль: неизвестных мало — перебираем их все, без случайности
  const exact=unknown.length<=10;
  // После кеширования портфеля вычисления заметно подешевели — увеличиваем
  // глубину взгляда вперёд, это чисто Expert-эксклюзивное преимущество.
  const samples=exact?unknown.length:(gamePhase()>0.6?70:42);
  const oppK=Math.min(6,Math.max(1,G.pHand.length));

  let total=0;
  for(let k=0;k<samples;k++){
    const drawCard=exact?unknown[k]:unknown[(Math.random()*unknown.length)|0];
    const dc=bestCaptureOptionForCard(drawCard,baseTable,baseCap,G.pCap);
    const drawTaken=baseTable.filter(c=>dc.ids.includes(c.id));
    let table2=baseTable.filter(c=>!dc.ids.includes(c.id));
    const cap2=[...baseCap];
    if(dc.ids.length)cap2.push(drawCard,...drawTaken);else table2=[...table2,drawCard];
    total+=dc.score*0.55-opponentBestResponse(table2,G.pCap,cap2,unknown,oppK)*0.5;
  }
  return expertBaseScore(action)+total/samples;
}

// ── Четыре уровня ИИ ─────────────────────────────────────────────
function aiChooseMove(){
  invalidateUnknownCache(); // состав известного не меняется внутри одной оценки хода
  const moves=legalMovesForHand(G.aHand);
  if(!moves.length)return null;
  if(DIFF===1) return moves[(Math.random()*moves.length)|0];
  let best=moves[0],bs=-Infinity,bi=0;
  const scored=moves.map((m,i)=>{
    const s=DIFF===2?normalActionScore(m):DIFF===3?hardActionScore(m):expertSimulationScore(m);
    if(s>bs){bs=s;best=m;bi=i;}
    return {card:cardDesc(m.card),capture:m.captureIds.length>0,captureCount:m.captureIds.length,score:+s.toFixed(3)};
  });
  // Пишем событие только когда был реальный выбор — единственный
  // легальный ход не решение, а вынужденный ход.
  if(moves.length>1){
    logEvent('ai_move_decision',{round:G.round,diff:DIFF,phase:+gamePhase().toFixed(2),candidates:scored,chosenIndex:bi});
  }
  return best;
}
function aiChooseCaptureIds(card){
  invalidateUnknownCache();
  const opts=captureOptions(card);
  if(opts.length===1)return opts[0];
  if(DIFF===1)return opts[(Math.random()*opts.length)|0];
  let best=opts[0],bs=-Infinity,bi=0;
  const scored=opts.map((ids,i)=>{
    const a={card,captureIds:ids};
    let s=immediateGain(a,G.aCap);
    if(DIFF===3) s+=defensiveGain(a)*0.85;               // Hard — без изменений
    else if(DIFF===4){                                    // Expert — тот же принцип, что в expertBaseScore
      const def=defensiveGain(a);
      s+=def*1.5+Math.max(0,def-2)*1.3;
    }
    if(s>bs){bs=s;best=ids;bi=i;}
    return {captureIds:ids.map(id=>{const c=G.table.find(t=>t.id===id);return c?cardDesc(c):null;}),score:+s.toFixed(3)};
  });
  logEvent('ai_capture_choice',{round:G.round,diff:DIFF,card:cardDesc(card),candidates:scored,chosenIndex:bi});
  return best;
}

function nearCompletionBonus(cap=G.aCap){
  let b=0;
  const ist=['boar','deer','butterfly'].filter(s=>cap.some(c=>c.sub===s)).length;if(ist===2)b+=4.5;
  const po=cap.filter(c=>c.sub==='poetry').length;if(po===2)b+=4;
  const bl=cap.filter(c=>c.sub==='blue').length;if(bl===2)b+=4;
  const br=cap.filter(c=>c.t==='bright'&&c.sub!=='rain').length;if(br===2)b+=3;if(br===3)b+=4;
  const sake=cap.some(c=>c.sub==='sake');
  if(sake&&!cap.some(c=>c.sub==='curtain'))b+=2.5;if(sake&&!cap.some(c=>c.sub==='moon'))b+=2.5;
  return b;
}

// Выплата без обращения к глобальным флагам — нужна для сравнения сценариев.
function payout(base,doubled){ return doubled?base*2:base; }
// Ключевой момент правил Kittyfooda: при исчерпании рук раунд не сгорает,
// а достаётся тому, у кого яку дороже. Значит Мяу-Мяу с сильным яку
// гораздо безопаснее, чем в классических правилах.
//
// Решение строится в ОДНИХ единицах — ожидаемых очках портфеля — для
// обеих сторон. Отсюда бесплатно получается нужное поведение: если у
// игрока портфель почти пуст (ему нечего собирать), риск продолжения
// у нас низкий и «взять яку и стоп» само по себе не станет предпочтительнее
// без явного правила — сравнение чисел решает это само.
// Калибровка №2: сила ответной реакции противника (weightOpp ниже).
let LAST_KOI_BREAKDOWN=null;
function expertKoiEV(pts){
  const draws=G.aHand.length;
  const doubled=G.koiKoi||G.aKoiKoi;
  const stopNow=payout(pts,doubled);
  if(draws<=0){ LAST_KOI_BREAKDOWN={ownEV:0,oppEV:0,pOppBeats:0,stopNow}; return -99; }

  // Ожидаемый ИТОГ портфеля ИИ, если раунд доиграется до конца —
  // уже включает и то, что достигнуто, и вероятностную надбавку.
  const ownEV=Math.max(pts,basePortfolio().ai);
  // То же для игрока — единственный источник «угрозы» в этой модели.
  const oppEV=basePortfolio().opp;

  // Грубая оценка «кто победит по яку», если руки кончатся раньше стопа:
  // относительная сила портфелей. weightOpp — та самая калибровка:
  // при 0 угроза от противника нулевая, но не может расти быстрее нас.
  const weightOpp=0.55;
  const pOppBeats=oppEV<=0?0.03:Math.min(0.85,(oppEV*weightOpp)/(oppEV*weightOpp+ownEV+1));

  // Раунд заканчивается либо явным стопом (тогда действует ×2 за Мяу-Мяу),
  // либо исчерпанием рук — а там теперь БЕЗ множителя, только разница сумм
  // яку (см. endRound). pExhaust — грубая оценка, что до явного стопа дело
  // не дойдёт и раунд решится именно исчерпанием: чем позже фаза игры и
  // меньше ходов остаётся, тем выше шанс не успеть зафиксировать стоп.
  const pExhaust=Math.max(0.15,Math.min(0.75,gamePhase()));
  const winExplicit=payout(ownEV,true);
  const winExhaust=Math.max(0,ownEV-oppEV);
  const winContinue=(1-pExhaust)*winExplicit+pExhaust*winExhaust;
  const loseExplicit=-payout(oppEV,true);
  const loseExhaust=-Math.max(0,oppEV-ownEV);
  const loseContinue=(1-pExhaust)*loseExplicit+pExhaust*loseExhaust;
  const evKoi=(1-pOppBeats)*winContinue+pOppBeats*loseContinue;
  LAST_KOI_BREAKDOWN={ownEV:+ownEV.toFixed(2),oppEV:+oppEV.toFixed(2),pOppBeats:+pOppBeats.toFixed(2),stopNow:+stopNow.toFixed(2),evKoi:+evKoi.toFixed(2)};
  return evKoi-stopNow;
}
function aiShouldKoiKoi(pts){
  invalidateUnknownCache();
  if(DIFF===1){
    const d=pts<3&&Math.random()<0.65;
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,pts,decision:d?'koikoi':'stop'});
    return d;
  }
  const near=nearCompletionBonus();
  if(DIFF===2){
    const d=pts<3||(pts<5&&near>=4);
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,pts,near:+near.toFixed(2),decision:d?'koikoi':'stop'});
    return d;
  }
  const threat=playerThreatScore(),phase=gamePhase();
  if(DIFF===3){
    let d;
    if(threat>=18||phase>0.75) d=false;
    else d=pts<4||(pts<6&&near>=4.5);
    logEvent('ai_koikoi_decision',{round:G.round,diff:DIFF,pts,threat:+threat.toFixed(2),near:+near.toFixed(2),decision:d?'koikoi':'stop'});
    return d;
  }
  // Expert: решение по матожиданию с поправкой на положение в матче
  const ev=expertKoiEV(pts);
  const lead=G.scores[1]-G.scores[0];
  const roundsLeft=G.rounds-G.round;
  let d;
  if(lead>10&&roundsLeft<=1&&pts>=2) d=false;        // ведём под конец — фиксируем
  else if(lead<-10&&roundsLeft<=1)   d=ev>-4;         // догоняем — рискуем шире
  else                                d=ev>0;
  logEvent('ai_koikoi_decision',Object.assign({round:G.round,diff:DIFF,pts,ev:+ev.toFixed(2),lead,roundsLeft},LAST_KOI_BREAKDOWN,{decision:d?'koikoi':'stop'}));
  return d;
}

function aiTurnStart(){
  if(!G.aHand.length){endRound();return;}
  G.turn='ai';G.phase='wait';G.msg='Ход компьютера...';draw();setTimeout(aiPlay,650);
}
function aiPlay(){
  if(!G.aHand.length){endRound();return;}
  const move=aiChooseMove();if(!move){endRound();return;}
  const idx=move.handIndex,card=G.aHand[idx];
  const targets=G.table.filter(c=>move.captureIds.includes(c.id));
  G.aiHL=idx;G.aiCard=card;G.aiTargets=[];G.aiPreview=null;
  G.msg=`ИИ открывает карту: месяц ${card.m} (${card.t})`;draw();
  setTimeout(()=>{
    G.aiTargets=targets;
    G.msg=targets.length?`ИИ выбрал захват месяца ${card.m}`:`ИИ кладёт карту месяца ${card.m} на стол`;draw();
    setTimeout(()=>{
      G.aiHL=-1;G.aiCard=null;G.aiTargets=[];G.aHand.splice(idx,1);
      const n=applyCapture(card,G.aCap,move.captureIds);
      G.msg=n?`ИИ захватил ${n} карты (месяц ${card.m})`:'ИИ кладёт карту на стол';draw();setTimeout(aiDraw,500);
    },430);
  },430);
}
function aiDraw(){
  if(!G.deck.length){finishAiTurn();return;}
  const card=G.deck[G.deck.length-1];
  G.aiPreview=card;G.aiTargets=G.table.filter(c=>c.m===card.m);
  G.msg=G.aiTargets.length?`Из колоды: месяц ${card.m} — совпадение!`:`Из колоды: месяц ${card.m} — на стол`;draw();
  setTimeout(()=>{
    G.aiPreview=null;G.aiTargets=[];G.deck.pop();
    const ids=aiChooseCaptureIds(card);
    const chosen=G.table.filter(c=>ids.includes(c.id));
    G.aiTargets=chosen;draw();
    setTimeout(()=>{
      G.aiTargets=[];
      const n=applyCapture(card,G.aCap,ids);
      G.msg=n?`ИИ из колоды захватил ${n} карты`:'ИИ из колоды кладёт карту на стол';draw();
      setTimeout(finishAiTurn,350);
    },300);
  },600);
}
let KOIKOI_POPUP=null; // 'ai'|'player'|null — временный крупный попап поверх экрана
function showKoiKoiPopup(side,cb){
  KOIKOI_POPUP=side;draw();
  setTimeout(()=>{KOIKOI_POPUP=null;draw();if(cb)cb();},900);
}
function finishAiTurn(){
  const yaku=getYaku(G.aCap),pts=yakuPts(yaku),key=yakuKey(yaku);
  const improved=pts>0&&(pts>G.aPrevPts||key!==G.aPrevYakuKey);
  if(improved){
    G.aPrevPts=pts;G.aPrevYakuKey=key;
    if(!aiShouldKoiKoi(pts)){
      G.msg=`ИИ: яку ${pts}, СТОП!`;draw();setTimeout(()=>endRound('ai',scoredPoints(pts)),900);return;
    }
    G.aKoiKoi=true;G.msg=`🐱 ИИ говорит МЯУ-МЯУ! (${pts} оч.)`;
    showKoiKoiPopup('ai',passToPlayer);return;
  }
  if(!G.pHand.length&&!G.aHand.length){endRound();return;}
  passToPlayer();
}
function passToPlayer(){
  if(!G.pHand.length&&!G.aHand.length){endRound();return;}
  G.turn='player';G.phase='select';G.sel=null;G.msg='Ваш ход — выберите карту из руки';draw();
}

// ── Завершение раунда ────────────────────────────────────────────
function endRound(winner,pts){
  G.phase='roundover';
  let roundWinner=winner,roundPts=0,roundYaku=[];
  if(winner==='player'){
    const y=getYaku(G.pCap),base=yakuPts(y);
    const award=pts==null?scoredPoints(base):pts;
    G.scores[0]+=award;G.dealer='player';
    G.msg=`Раунд ${G.round}: вы выиграли! +${award} очков${scoreBreakdown(base)}`;
    roundPts=award;roundYaku=y.map(x=>x.n);
  }else if(winner==='ai'){
    const y=getYaku(G.aCap),base=yakuPts(y);
    const award=pts==null?scoredPoints(base):pts;
    G.scores[1]+=award;G.dealer='ai';
    G.msg=`Раунд ${G.round}: ИИ выиграл! +${award} очков${scoreBreakdown(base)}`;
    roundPts=award;roundYaku=y.map(x=>x.n);
  }else{
    // House rule Kittyfooda: при исчерпании рук — БЕЗ множителя за Мяу-Мяу.
    // Награда — разница между суммами яку, а не полная сумма победителя.
    // Так объявление Мяу-Мяу становится настоящим риском: если не успел
    // зафиксировать явным стопом, а колода кончилась — бонуса не будет.
    const pp=yakuPts(getYaku(G.pCap)),ap=yakuPts(getYaku(G.aCap));
    if(pp>ap){
      const award=pp-ap;G.scores[0]+=award;G.dealer='player';
      G.msg=`Раунд ${G.round}: по яку — вы! +${award} оч. (разница ${pp}−${ap})`;
      roundWinner='player';roundPts=award;roundYaku=getYaku(G.pCap).map(x=>x.n);
    }else if(ap>pp){
      const award=ap-pp;G.scores[1]+=award;G.dealer='ai';
      G.msg=`Раунд ${G.round}: по яку — ИИ! +${award} оч. (разница ${ap}−${pp})`;
      roundWinner='ai';roundPts=award;roundYaku=getYaku(G.aCap).map(x=>x.n);
    }else{
      // При равенстве dealer сохраняется.
      G.msg=`Раунд ${G.round}: ничья`;
      roundWinner='draw';
    }
  }
  logEvent('round_end',{round:G.round,winner:roundWinner,pts:roundPts,yaku:roundYaku,scores:[...G.scores]});
  if(G.round>=G.rounds){
    G.phase='gameover';
    const result=G.scores[0]>G.scores[1]?'win':(G.scores[0]<G.scores[1]?'lose':'draw');
    saveMatchResult(result,G.scores[0],G.scores[1]);
    logEvent('game_end',{result,scores:[...G.scores],diff:DIFF});
  }
  draw();
}

// ── Небольшие sanity-checks правил; можно удалить после стабилизации ──
function runRuleSanityChecks(){
  const d=buildDeck();
  const by=(m,t)=>d.find(c=>c.m===m&&(!t||c.t===t));
  const c1=by(1,'bright'),m1=d.filter(c=>c.m===1&&c.id!==c1.id);
  console.assert(captureOptions(c1,[]).length===1&&captureOptions(c1,[])[0].length===0,'capture 0');
  console.assert(captureOptions(c1,[m1[0]]).length===1&&captureOptions(c1,[m1[0]])[0].length===1,'capture 1');
  console.assert(captureOptions(c1,[m1[0],m1[1]]).length===2,'capture 2 choice');
  console.assert(captureOptions(c1,[m1[0],m1[1],m1[2]])[0].length===3,'capture 3 all');
  console.assert(getYaku([d.find(c=>c.sub==='sake'),...d.filter(c=>c.t==='plain').slice(0,9)]).some(y=>y.n.startsWith('Касу')),'sake counts as chaff');
  return true;
}

// ── Рисование ────────────────────────────────────────────────────
function draw(){
  ct.clearRect(0,0,W,H);
  ct.fillStyle='#0a0603';ct.fillRect(0,0,W,H);
  if(G.phase==='start'||G.phase==='gameover'){drawOverlay();return;}
  if(G.phase==='log'){drawEventLogScreen();return;}
  drawHeader();
  drawAIHand();
  drawTable();
  drawDeck();
  drawCapSummary();
  drawPlayerHand();
  drawMsgBar();
  if(G.phase==='choose')    drawChoiceBtns();
  if(G.phase==='roundover') drawRoundOver();
  if(KOIKOI_POPUP) drawKoiKoiPopup();
  persistState();
}
function drawKoiKoiPopup(){
  const isAi=KOIKOI_POPUP==='ai';
  const col=isAi?'#c04040':'#70e870';
  const who=isAi?'ИИ':'ВЫ';
  ct.save();
  ct.fillStyle='rgba(4,2,1,.55)';ct.fillRect(0,0,W,H);
  const cy=H*0.42,cw=300,ch=104;
  ct.shadowColor=col;ct.shadowBlur=28;
  ct.fillStyle='rgba(10,6,3,.92)';
  ct.beginPath();rr((W-cw)/2,cy-ch/2,cw,ch,16);ct.fill();
  ct.shadowBlur=0;
  ct.strokeStyle=col;ct.lineWidth=2.5;
  ct.beginPath();rr((W-cw)/2,cy-ch/2,cw,ch,16);ct.stroke();
  ct.textAlign='center';ct.textBaseline='middle';
  ct.fillStyle=col;ct.font='bold 15px Georgia';
  ct.fillText(`${who} ГОВОРИТ`,W/2,cy-24);
  ct.font='bold 34px Georgia';
  ct.fillText('🐱 МЯУ-МЯУ!',W/2,cy+12);
  ct.restore();
}

};const cardImgCache = {};

function cardImgName(card){
  if(card.t==='bright') return `m${card.m}_bright`;
  if(card.t==='animal') return `m${card.m}_animal`;
  if(card.t==='ribbon') return `m${card.m}_ribbon`;
  // plain — нужен стабильный номер (1/2/3) для конкретной карты месяца
  return `m${card.m}_plain${card.plainIdx||1}`;
}
// Папка с картинками карт. Файлы здесь ПЕРЕКРЫВАЮТ встроенные —
// можно подменять карты по одной, остальные останутся рисованными.
const CARD_IMG_BASE = 'cards/';
// Расширения, которые ищутся по очереди. Хочешь заменить на растр —
// просто положи cards/m1_bright.png, менять код не нужно.
const CARD_IMG_EXT = ['png','jpg','svg'];

function embedSrc(name){
  const src=CARD_SVG[name];
  return src ? 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src) : null;
}

function getCardImg(card){
  const name=cardImgName(card);
  if(!cardImgCache[name]){
    const entry={img:new Image(),loaded:false};
    cardImgCache[name]=entry;
    let i=0;
    const tryNext=()=>{
      if(i<CARD_IMG_EXT.length){
        entry.img.src=CARD_IMG_BASE+name+'.'+CARD_IMG_EXT[i++];
        return;
      }
      // Внешнего файла нет — берём встроенный рисунок
      const fb=embedSrc(name);
      if(fb){ entry.img.onerror=null; entry.img.src=fb; }
      else console.warn('нет спрайта для карты:',name);
    };
    entry.img.onload=()=>{entry.loaded=true;draw();};
    entry.img.onerror=tryNext;
    tryNext();
  }
  return cardImgCache[name];
}

function drawCard(x,y,card,face=true,sel=false){
  ct.save();
  if(sel){ct.shadowColor='rgba(255,240,80,.95)';ct.shadowBlur=20;}
  if(!face){
    const g=ct.createLinearGradient(x,y,x+CW,y+CH);
    g.addColorStop(0,'#2a1a6a');g.addColorStop(1,'#180e48');
    ct.fillStyle=g;ct.fillRect(x,y,CW,CH);
    ct.strokeStyle='#5a4aaa';ct.lineWidth=2;ct.strokeRect(x+2,y+2,CW-4,CH-4);
    for(let i=0;i<3;i++)for(let j=0;j<5;j++){
      if((i+j)%2===0){ct.fillStyle='rgba(255,255,255,.06)';ct.fillRect(x+4+i*17,y+4+j*15,17,15);}
    }
    ct.restore();return;
  }
  const entry=getCardImg(card);
  if(entry.loaded){
    ct.drawImage(entry.img,x,y,CW,CH);
    ct.strokeStyle='rgba(0,0,0,.5)';ct.lineWidth=1.5;ct.strokeRect(x,y,CW,CH);
  }else{
    // Пока картинка грузится — временная заглушка на основе старого стиля
    const m=MON[card.m-1];
    ct.fillStyle=m.c;ct.fillRect(x,y,CW,CH);
    ct.strokeStyle='rgba(0,0,0,.6)';ct.lineWidth=2;ct.strokeRect(x,y,CW,CH);
  }
  ct.restore();
}

function tsc(c){
  if(c.t==='bright') return['★','#ffd700'];
  if(c.t==='animal') return['♦','#f0f0f0'];
  if(c.t==='ribbon'){
    if(c.sub==='poetry')return['▬','#ff5050'];
    if(c.sub==='blue')  return['▬','#60a0ff'];
    return['▬','#cc60cc'];
  }
  return['·','rgba(255,255,255,.45)'];
}
function lighten(h,n){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return`rgb(${Math.min(255,r+n)},${Math.min(255,g+n)},${Math.min(255,b+n)})`;
}

}

  ct.fillStyle='rgba(255,255,255,.3)';ct.font='13px Georgia';
  ct.textAlign='center';ct.textBaseline='top';
  ct.fillText('Выберите:',W/2,YBTN-22);

  mkbtn(W/2+6,YBTN,W/2-20,36,'🐱  МЯУ-МЯУ','#4a1010','#c04040');

function drawRoundOver(){
  ct.fillStyle='rgba(0,0,0,.78)';ct.fillRect(0,0,W,H);
  ct.fillStyle='#f0d070';ct.font='bold 22px Georgia';
  ct.textAlign='center';ct.textBaseline='middle';
  ct.fillText(G.msg,W/2,H/2-34);
  ct.fillStyle='#d4b896';ct.font='17px Georgia';

}

// ── Экран журнала партий ────────────────────────────────────────
let ACTION_FLASH=null; // 'download'|'copy'|'clear' — кратковременная подсветка кнопки
function drawEventLogScreen(){
  ct.fillStyle='#0a0603';ct.fillRect(0,0,W,H);
  ct.textAlign='center';
  ct.fillStyle='#c9a227';ct.font='bold 20px Georgia';ct.textBaseline='top';
  ct.fillText('Журнал событий',W/2,18);
  ct.fillStyle='rgba(255,255,255,.4)';ct.font='11px Georgia';
  ct.fillText('хранится в этом браузере, между устройствами не синхронизируется',W/2,44);

  const count=eventLogCount();
  ct.fillStyle='rgba(255,255,255,.85)';ct.font='16px Georgia';ct.textBaseline='middle';
  ct.fillText(count?`Записано событий: ${count}`:'Журнал пуст — сыграйте партию',W/2,H/2-70);
  ct.fillStyle='rgba(255,255,255,.4)';ct.font='11px Georgia';
  ct.fillText('каждое решение ИИ — со всеми рассмотренными вариантами и их оценками',W/2,H/2-46);

  const bw=260,bh=38,bx=(W-bw)/2;
  const rows=[
    {key:'download',label:ACTION_FLASH==='download'?'✓ ФАЙЛ СКАЧАН':'⬇️ СКАЧАТЬ JSON',y:H/2-10,color:'#c9a227'},
    {key:'copy',label:ACTION_FLASH==='copy'?'✓ СКОПИРОВАНО':'📋 СКОПИРОВАТЬ JSON',y:H/2+34,color:'#c9a227'},
    {key:'clear',label:ACTION_FLASH==='clear'?'✓ ОЧИЩЕНО':'🗑 ОЧИСТИТЬ ЖУРНАЛ',y:H/2+78,color:'#c04040'},
  ];
  rows.forEach(r=>{
    const flash=ACTION_FLASH===r.key;
    ct.strokeStyle=flash?'#70e870':r.color;ct.lineWidth=2;
    ct.beginPath();rr(bx,r.y,bw,bh,8);ct.stroke();
    ct.fillStyle=flash?'#70e870':r.color;ct.font='bold 14px Georgia';
    ct.fillText(r.label,W/2,r.y+bh/2);
  });

  ct.fillStyle='#c9a227';ct.font='bold 15px Georgia';ct.textBaseline='bottom';
  ct.fillText('[ НАЗАД ]',W/2,H-24);
}

function drawOverlay(){
  ct.fillStyle='rgba(4,2,1,.9)';ct.fillRect(0,0,W,H);
  ct.textAlign='center';
  if(G.phase==='gameover'){
    const win=G.scores[0]>G.scores[1];
    ct.fillStyle=win?'#f0d070':'#c04040';
    ct.font='bold 30px Georgia';ct.textBaseline='middle';
    ct.fillText(win?'Вы победили! 🎉':'ИИ победил!',W/2,H/2-60);
    ct.fillStyle='#c9a227';ct.font='22px Georgia';
    ct.fillText(`${G.scores[0]}  :  ${G.scores[1]}`,W/2,H/2-14);
  }else{
    if(TG_USER){
      ct.fillStyle='rgba(255,255,255,.55)';ct.font='13px Georgia';
      ct.fillText(`Сыграно: ${PLAYER_STATS.wins+PLAYER_STATS.losses+PLAYER_STATS.draws}   ·   Побед: ${PLAYER_STATS.wins}   ·   Поражений: ${PLAYER_STATS.losses}`,W/2,H/2-64);
    }
    ct.fillStyle='#c9a227';ct.font='bold 13px Georgia';
    ct.fillText('— комбинации (яку) —',W/2,H/2-72-6*17);
    ct.fillStyle='#d4b896';ct.font='11px Georgia';
    ct.textAlign='left';
    const yakuList=[
      ['Sanko','3 Brights, excluding Rain Man','5 pts'],
      ['Shiko','4 Brights, excluding Rain Man','8 pts'],
      ['Ame-Shiko','4 Brights, including Rain Man','7 pts'],
      ['Goko','all 5 Brights','10 pts'],
      ['Ino-Shika-Cho','Boar + Deer + Butterfly','5 pts'],
      ['Akatan','3 Poetry Ribbons (#1,2,3)','5 pts'],
      ['Aotan','3 Blue Ribbons (#6,9,10)','5 pts'],
      ['Hanami-zake','Curtain (#3) + Sake Cup','3 pts'],
      ['Tsukimi-zake','Moon (#8) + Sake Cup','3 pts'],
      ['Tane','5+ Animal cards','+1 each beyond 4'],
      ['Tan','5+ Ribbon cards (any)','+1 each beyond 4'],
      ['Kasu','10+ Chaff cards','+1 each beyond 9'],
    ];
    const lx=16; // растянуто до левого края canvas
    const rx=W-16; // правый край
    yakuList.forEach((row,i)=>{
      const y=H/2-52-6*17+i*17;
      ct.fillStyle='#f0d070';ct.fillText(row[0],lx,y);
      ct.fillStyle='rgba(212,184,150,.85)';ct.fillText(row[1],lx+90,y);
      ct.fillStyle='#c9a227';ct.textAlign='right';ct.fillText(row[2],rx,y);
      ct.textAlign='left';
    });
    ct.textAlign='center';
    ct.fillStyle='#70e870';ct.font='bold 12px Georgia';
    ct.fillText('МЯУ-МЯУ = ×2 ОЧКОВ ПОБЕДИТЕЛЮ РАУНДА',W/2,H/2-52-6*17+yakuList.length*17+14);
  }
  ct.fillStyle='#c9a227';ct.font='bold 16px Georgia';ct.textBaseline='bottom';
  if(G.phase==='start'){
    if(TG_USER && !SYNC_DONE){
      ct.fillStyle='rgba(255,255,255,.4)';ct.font='13px Georgia';
      ct.fillText('Загрузка...',W/2,H-140);
    }else{
      const bw=220,bh=38,bx=(W-bw)/2;
      const by1=H-186, by2=H-134; // две кнопки с зазором между ними
      // Кнопка "Новая игра"
      ct.strokeStyle='#c9a227';ct.lineWidth=2;
      ct.beginPath();rr(bx,by1,bw,bh,8);ct.stroke();
      ct.fillStyle='#c9a227';ct.font='bold 15px Georgia';ct.textBaseline='middle';
      ct.fillText('НОВАЯ ИГРА',W/2,by1+bh/2);
      // Кнопка "Продолжить"
      const contActive=!!SAVED_GAME;
      ct.strokeStyle=contActive?'#70e870':'rgba(255,255,255,.22)';ct.lineWidth=2;
      ct.beginPath();rr(bx,by2,bw,bh,8);ct.stroke();
      ct.fillStyle=contActive?'#70e870':'rgba(255,255,255,.22)';
      ct.fillText('ПРОДОЛЖИТЬ ИГРУ',W/2,by2+bh/2);
      // Кнопка "Журнал партий"
      const by3=by2+bh+14;
      ct.strokeStyle='rgba(255,255,255,.5)';ct.lineWidth=2;
      ct.beginPath();rr(bx,by3,bw,bh,8);ct.stroke();
      ct.fillStyle='rgba(255,255,255,.8)';ct.font='bold 13px Georgia';
      ct.fillText('ЖУРНАЛ СОБЫТИЙ',W/2,by3+bh/2);
      ct.font='bold 15px Georgia';
      ct.textBaseline='bottom';
    }
  }else{
    ct.fillText(G.phase==='gameover'?'[ НАЧАТЬ ЗАНОВО ]':'[ НАЧАТЬ ИГРУ ]',W/2,H-24);
  }
}

// ── События ───────────────────────────────────────────────────────
cv.addEventListener('click',e=>{
  const rect=cv.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);

  if(G.phase==='log'){
    const bw=260,bh=38,bx=(W-bw)/2;
    const flash=(key)=>{ ACTION_FLASH=key; draw(); setTimeout(()=>{ACTION_FLASH=null;draw();},1200); };
    if(mx>=bx&&mx<=bx+bw&&my>=H/2-10&&my<=H/2-10+bh){ downloadEventLog(); flash('download'); return; }
    if(mx>=bx&&mx<=bx+bw&&my>=H/2+34&&my<=H/2+34+bh){ copyEventLogToClipboard(()=>flash('copy')); return; }
    if(mx>=bx&&mx<=bx+bw&&my>=H/2+78&&my<=H/2+78+bh){ clearEventLog(); flash('clear'); return; }
    G.phase='start'; draw(); return; // клик мимо кнопок — назад
  }

  // Шапка (сложность, подсказка) не рисуется на start/gameover — не перехватываем клики там
  if(G.phase!=='start'&&G.phase!=='gameover'){
    const _bw=70,_gap=5,_total=4*(_bw+_gap)-_gap,_bx0=(W-_total)/2;
    for(let d=0;d<4;d++){
      const bx=_bx0+d*(_bw+_gap);
      if(mx>=bx&&mx<=bx+_bw&&my>=34&&my<=54){DIFF=d+1;draw();return;}
    }
    if(mx>=W-40&&mx<=W-6&&my>=4&&my<=28){ useHint(); return; }
  }

  if(G.phase==='start'){
    if(TG_USER && !SYNC_DONE){ return; } // ждём ответа сервера — клики игнорируем
    const bw=220,bx=(W-bw)/2,bh=38;
    const by1=H-186, by2=H-134, by3=by2+bh+14;
    if(mx>=bx&&mx<=bx+bw&&my>=by3&&my<=by3+bh){ G.phase='log'; draw(); return; }
    if(mx>=bx&&mx<=bx+bw&&my>=by2&&my<=by2+bh){
      if(SAVED_GAME){
        G=SAVED_GAME; SAVED_GAME=null;
        // Страховка на случай снапшота, сохранённого старой версией в фазе 'wait'
        if(G.phase==='wait'){
          G.phase='select'; G.turn='player';
          G.msg='Ваш ход — выберите карту из руки';
        }
        draw();
      }
      return; // клик по неактивной кнопке — ничего не делает
    }
    if(mx>=bx&&mx<=bx+bw&&my>=by1&&my<=by1+bh){ newGame(); return; }
    return; // клик мимо обеих кнопок на старте — ничего не делает
  }
  if(G.phase==='gameover'){newGame();return;}
  if(G.phase==='roundover'){G.round++;newRound();return;}

  if(G.phase==='captureSelect'&&G.pendingCapture?.owner==='player'){
    const sorted=[...G.table].sort((a,b)=>a.m-b.m);
    for(let i=0;i<sorted.length;i++){
      const row=Math.floor(i/5),col=i%5;
      const x=TX+col*(CW+CG),y=YTAB+row*(CH+CG);
      if(mx>=x&&mx<=x+CW&&my>=y&&my<=y+CH){playerResolveCapture(sorted[i].id);return;}
    }
    return;
  }

  if(G.phase==='choose'){
    if(mx>=14&&mx<=W/2-20&&my>=YBTN&&my<=YBTN+36) playerChoose(true);
    if(mx>=W/2+6&&mx<=W-14&&my>=YBTN&&my<=YBTN+36) playerChoose(false);
    return;
  }

  if((G.phase==='select')&&G.turn==='player'){
    for(let i=0;i<G.pHand.length;i++){
      const x=HX+i*(CW+CG), y=YPH+(G.sel===i?-10:0);
      if(mx>=x&&mx<=x+CW&&my>=y-6&&my<=y+CH+6){
        if(G.sel===i){ playerPlay(i); }
        else{ G.sel=i; G.msg=`Выбрана карта: месяц ${G.pHand[i].m}, тип ${G.pHand[i].t}.  Нажмите снова для хода.`; draw(); }
        return;
      }
    }
    G.sel=null;draw();
  }
});

// ── Старт ─────────────────────────────────────────────────────────
draw();
</script>
